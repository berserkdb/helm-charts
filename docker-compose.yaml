# Berserk local development stack
# Derived from charts/berserk helm chart
#
# Usage:
#   docker compose up -d
#   docker compose logs -f
#   docker compose down -v  # removes volumes too
#
#   # 1) Grab the one-time admin setup URL from the gateway logs:
#   docker compose logs gateway | grep -A1 "Initial admin setup"
#
#   # 2) Open it in a browser (the URL points at 127.0.0.1:9500 — the
#   # auth-edge gateway is the single public entry point):
#   open http://localhost:9500
#
#   # 3) Authenticate the CLI through the gateway:
#   bzrk profile add local --endpoint http://localhost:9500
#   bzrk profile use local
#   bzrk login
#   bzrk search "default | take 10" --since "1h ago"
#
# Requires Docker Compose v2.23.1+ (for inline configs).
#
# Image tags below are pinned to the upcoming chart release that
# carries the unified gateway + ui + permissions topology (the ui
# image serves both the data-plane and workspace-admin surfaces).
# If your local Docker daemon can't reach those tags yet, build the
# images from source via `bazel run //apps/<svc>:<svc>_tarball` for
# each service — they tag as `berserk/<svc>-dev:dev`, and an
# operator-side `image:` override switches compose onto them.
#
# Berserk is pre-release (beta) software, provided AS IS with no warranty.
# By running this stack you agree to the Berserk Terms of Use:
#   https://www.bzrk.dev/legal/pre-release-license-terms/
# Each service image also carries the terms at /usr/share/doc/berserk/NOTICE.md.

x-common: &common
  restart: unless-stopped
  networks:
    - berserk
  environment: &common-env
    RUST_BACKTRACE: "1"

configs:
  meta-config:
    content: |
      bind: "0.0.0.0:9560"
      database_url: $${META_DATABASE_URL}
      storage_endpoint: "http://minio:9000"
      storage_bucket: "berserk"
      storage_region: "us-east-1"
      observability:
        service_name: "meta"
        log_level: "info"
        otlp_enabled: true
        otlp_endpoint: "ingest:4317"

  query-config:
    content: |
      bind: "0.0.0.0:9510"
      meta_endpoint: "http://meta:9560"
      # Fan out to each nursery's NurseryQueryService for un-merged baby
      # segments before they merge to S3 — without this, freshly ingested
      # data isn't queryable until a merge lands (minutes, not seconds).
      # Paired with the nursery's query_grpc_bind below; mirrors
      # query.config.queryViaNursery in the helm chart.
      query_via_nursery: true
      cloud_storage_access_key: $${AWS_ACCESS_KEY_ID:}
      cloud_storage_secret_key: $${AWS_SECRET_ACCESS_KEY:}
      cache:
        dir: "/segment_cache"
        total_size_limit: "10Gi"
      observability:
        service_name: "query"
        log_level: "info"
        otlp_enabled: true
        otlp_endpoint: "ingest:4317"

  ingest-config:
    content: |
      meta_endpoint: "http://meta:9560"

      http_bind: "0.0.0.0:4318"
      grpc_bind: "0.0.0.0:4317"
      health_bind: "0.0.0.0:9550"

      require_auth: false
      lax_utf8: true

      loki_enabled: false

      max_batch_bytes: 16777216
      max_batch_age_secs: 2
      keep_alive_interval_secs: 120

      observability:
        service_name: "ingest"
        log_level: "info"
        otlp_enabled: true
        otlp_endpoint: "ingest:4317"

  janitor-config:
    content: |
      bind: "0.0.0.0:9502"
      meta_endpoint: "http://meta:9560"
      query_endpoint: "http://query:9510"
      cloud_storage_access_key: $${JANITOR_STORAGE_ACCESS_KEY:}
      cloud_storage_secret_key: $${JANITOR_STORAGE_SECRET_KEY:}
      merger:
        interval_seconds: 300
      observability:
        service_name: "janitor"
        log_level: "info"
        otlp_enabled: true
        otlp_endpoint: "ingest:4317"
      probe_jobs:
        - name: "default_take_one"
          query: "default | take 1"
          interval_seconds: 60
          since: "1h ago"

  nursery-config:
    content: |
      http_bind: "0.0.0.0:9530"
      meta_endpoint: "http://meta:9560"
      cloud_storage_access_key: $${NURSERY_STORAGE_ACCESS_KEY:}
      cloud_storage_secret_key: $${NURSERY_STORAGE_SECRET_KEY:}
      working_dir: "/var/cache/nursery"
      meta_default_poll_interval_secs: 5
      stream_timeout_secs: 300
      # Query-in-nursery lane: serve un-merged baby segments to the query
      # coordinator's fan-out (paired with query's query_via_nursery) so fresh
      # data is queryable before it merges to S3. qws_bin is bundled at
      # /qws_bin in the nursery image; the member endpoint advertises the
      # compose service name where the chart uses the pod IP. force_merge keeps
      # the un-merged tail short. Mirrors the nursery helm chart values.
      query_grpc_bind: "0.0.0.0:9531"
      qws_bin: "/qws_bin"
      query_grpc_member_endpoint: "http://nursery:9531"
      force_merge_stale_threshold_secs: 60
      observability:
        service_name: "nursery"
        log_level: "info"
        otlp_enabled: true
        otlp_endpoint: "ingest:4317"

  # The ui binary is the merged data-plane + workspace-admin app
  # (formerly a separate admin-ui). It needs the admin-plane wiring
  # — public_base_url, permissions_base_url, deployment_mode — or its
  # admin half fails config validation at startup.
  ui-config:
    content: |
      bind: "0.0.0.0:9570"
      query_endpoint: "http://query:9510"
      meta_endpoint: "http://meta:9560"
      public_base_url: "http://localhost:9500"
      gateway_internal_base_url: "http://gateway:9500"
      permissions_base_url: "http://permissions:9580"
      deployment_mode: self_hosted
      observability:
        service_name: "ui"
        log_level: "info"
        otlp_enabled: true
        otlp_endpoint: "ingest:4317"

  gateway-config:
    content: |
      bind: "0.0.0.0:9500"
      public_base_url: "http://localhost:9500"
      cookie_secure: false
      upstream_base_url: "http://ui:9570"
      permissions_base_url: "http://permissions:9580"
      deployment_mode: self_hosted
      grpc_routes: '[{"package_prefix":"meta","upstream":"http://meta:9560"},{"package_prefix":"query","upstream":"http://query:9510"},{"package_prefix":"opentelemetry","upstream":"http://ingest:4317"}]'
      session_ttl_secs: 1209600
      invite_ttl_secs: 604800
      reset_ttl_secs: 3600
      oidc_challenge_ttl_secs: 600
      grant_outbox_tick_secs: 5
      grant_outbox_retry_delay_secs: 5
      grant_outbox_batch_size: 50
      session_cleanup_interval_secs: 3600
      observability:
        service_name: "gateway"
        log_level: "info"
        otlp_enabled: true
        otlp_endpoint: "ingest:4317"

  # No bootstrap SQL needed: as of v1.0.112, gateway / ui /
  # permissions share the meta DB and isolate themselves via the
  # `auth` schema (gateway creates the schema on first boot and
  # pins every connection's `search_path` to it). sqlx puts
  # `_sqlx_migrations` in the first writable schema on the
  # connection's search_path, so `auth._sqlx_migrations` and
  # `public._sqlx_migrations` coexist without collision.

  # Idempotent bootstrap: create the `default` table and an ingest
  # token routed to it, then write the plaintext token to a shared
  # volume the ingest container reads at startup. The token is what
  # tells ingest which table to route OTLP to — without it, ingest
  # drops every incoming push regardless of `require_auth`. Mirrors
  # the `init-ingest-token` init container in the helm chart, minus
  # the K8s Secret API.
  init-ingest-token-script:
    content: |
      #!/bin/sh
      set -e
      TOKEN_FILE="/token/ingest-token"
      if [ -f "$$TOKEN_FILE" ] && [ -s "$$TOKEN_FILE" ]; then
        echo "Ingest token already exists at $$TOKEN_FILE, skipping creation."
        exit 0
      fi
      BZRK="/bzrk --endpoint meta:9560 --database default"
      TOKEN_NAME="default_ingest_token"
      echo "Ensuring 'default' table exists in meta..."
      $$BZRK table create default 2>/dev/null || true
      echo "Creating default ingest token..."
      if ! TOKEN=$$($$BZRK ingest-token create $$TOKEN_NAME --table default --simple 2>&1); then
        echo "Token '$$TOKEN_NAME' already exists in meta, replacing..."
        $$BZRK ingest-token revoke "$$TOKEN_NAME" || true
        $$BZRK ingest-token delete "$$TOKEN_NAME" || true
        TOKEN=$$($$BZRK ingest-token create $$TOKEN_NAME --table default --simple)
      fi
      echo "$$TOKEN" > "$$TOKEN_FILE"
      echo "Ingest token written to $$TOKEN_FILE"

  ingest-entrypoint-script:
    content: |
      #!/bin/sh
      set -e
      TOKEN_FILE="/token/ingest-token"
      if [ -f "$$TOKEN_FILE" ] && [ -s "$$TOKEN_FILE" ]; then
        export DEFAULT_INGEST_TOKEN=$$(cat "$$TOKEN_FILE")
        echo "Loaded ingest token from $$TOKEN_FILE"
      fi
      exec /ingest_bin "$$@"

services:
  # --- Infrastructure ---

  postgres:
    image: postgres:17
    networks:
      - berserk
    environment:
      POSTGRES_USER: berserk
      POSTGRES_PASSWORD: berserk
      POSTGRES_DB: berserk
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U berserk"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    networks:
      - berserk
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "19000:9000"
      - "19001:9001"  # MinIO Console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Create the default bucket on startup
  minio-init:
    image: minio/mc:latest
    networks:
      - berserk
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/berserk &&
      echo 'Bucket created successfully'
      "
    restart: "no"

  # Fix volume ownership for UID 1000 (mirrors Helm fsGroup: 1000)
  volume-init:
    image: alpine:latest
    entrypoint: /bin/sh -c "chown -R 1000:1000 /mnt/*"
    volumes:
      - query-cache:/mnt/query-cache
      - ingest-token:/mnt/ingest-token
      - janitor-cache:/mnt/janitor-cache
      - nursery-workdir:/mnt/nursery-workdir
    restart: "no"

  # --- Berserk Services ---

  meta:
    <<: *common
    image: ghcr.io/berserkdb/meta:v1.0.122
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *common-env
      META_DATABASE_URL: "postgres://berserk:berserk@postgres:5432/berserk"
    command: ["-c", "/config/config.yaml"]
    ports:
      - "9560:9560"
    configs:
      - source: meta-config
        target: /config/config.yaml
        mode: 0444
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9560'"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

  query:
    <<: *common
    image: ghcr.io/berserkdb/query:v1.0.122
    depends_on:
      meta:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      volume-init:
        condition: service_completed_successfully
    environment:
      <<: *common-env
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    command: ["-c", "/config/config.yaml"]
    ports:
      - "9510:9510"
    configs:
      - source: query-config
        target: /config/config.yaml
        mode: 0444
    volumes:
      - query-cache:/segment_cache
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9510'"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

  # Create the `default` table + an ingest token routed to it, then
  # write the plaintext token to a shared volume the ingest container
  # reads at startup. Talks to meta over gRPC directly (no bearer
  # token → ClientChannel::direct, see apps/cli/src/network/meta_client.rs).
  ingest-token-init:
    image: ghcr.io/berserkdb/cli:v1.0.122
    networks:
      - berserk
    depends_on:
      meta:
        condition: service_healthy
      volume-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "/scripts/init-ingest-token.sh"]
    configs:
      - source: init-ingest-token-script
        target: /scripts/init-ingest-token.sh
        mode: 0555
    volumes:
      - ingest-token:/token
    restart: "no"

  ingest:
    <<: *common
    image: ghcr.io/berserkdb/ingest:v1.0.122
    depends_on:
      meta:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      ingest-token-init:
        condition: service_completed_successfully
      volume-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "/scripts/ingest-entrypoint.sh"]
    command: ["-c", "/config/config.yaml"]
    environment:
      RUST_LOG: info
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "14317:4317"   # OTLP gRPC
      - "14318:4318"   # OTLP HTTP
      - "19550:9550"   # Health
    configs:
      - source: ingest-config
        target: /config/config.yaml
        mode: 0444
      - source: ingest-entrypoint-script
        target: /scripts/ingest-entrypoint.sh
        mode: 0555
    volumes:
      - ingest-token:/token:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9550'"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

  janitor:
    <<: *common
    image: ghcr.io/berserkdb/janitor:v1.0.122
    depends_on:
      meta:
        condition: service_healthy
      query:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      volume-init:
        condition: service_completed_successfully
    environment:
      <<: *common-env
      JANITOR_STORAGE_ACCESS_KEY: minioadmin
      JANITOR_STORAGE_SECRET_KEY: minioadmin
    command: ["-c", "/config/config.yaml"]
    configs:
      - source: janitor-config
        target: /config/config.yaml
        mode: 0444
    volumes:
      - janitor-cache:/tmp/segment-cache
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9502'"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 10

  nursery:
    <<: *common
    image: ghcr.io/berserkdb/nursery:v1.0.122
    depends_on:
      meta:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      volume-init:
        condition: service_completed_successfully
    environment:
      <<: *common-env
      NURSERY_STORAGE_ACCESS_KEY: minioadmin
      NURSERY_STORAGE_SECRET_KEY: minioadmin
    command: ["-c", "/config/config.yaml"]
    configs:
      - source: nursery-config
        target: /config/config.yaml
        mode: 0444
    volumes:
      - nursery-workdir:/var/cache/nursery
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9530'"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 10

  ui:
    <<: *common
    image: ghcr.io/berserkdb/ui:v1.0.122
    depends_on:
      postgres:
        condition: service_healthy
      query:
        condition: service_healthy
      meta:
        condition: service_healthy
      permissions:
        condition: service_healthy
    environment:
      <<: *common-env
      # Per-user preferences live in the shared workspace DB, isolated
      # in the `ui` schema (apps/ui's default). Without it the ui binary
      # fails config validation ("missing required field: database_url").
      UI_DATABASE_URL: "postgres://berserk:berserk@postgres:5432/berserk"
      # Constant-time-compared by the trusted-identity extractor in
      # `apps/ui` against the `X-Bzrk-Service-Token` header gateway
      # injects on every proxied request. Production stacks generate
      # a high-entropy value; the localhost dev stack hard-codes a
      # short shared secret so the three services agree out of the
      # box.
      UI_GATEWAY_SERVICE_TOKEN: "local-dev-gateway-service-token"
      # The merged ui serves the workspace-admin surfaces, which call
      # apps/permissions /v1/check with this pre-shared token.
      UI_PERMISSIONS_SERVICE_TOKEN: "local-dev-permissions-service-token"
      LEPTOS_OUTPUT_NAME: ui
      LEPTOS_SITE_ROOT: /
      LEPTOS_SITE_PKG_DIR: pkg
      LEPTOS_SITE_ADDR: "0.0.0.0:9570"
      ENVIRONMENT: local
    command: ["-c", "/config/config.yaml"]
    # ui is no longer the public entry point — gateway (port 9500)
    # fronts it. Leave the internal port unmapped; debugging is via
    # `docker compose exec ui` or `docker compose port ui 9570`.
    configs:
      - source: ui-config
        target: /config/config.yaml
        mode: 0444
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9570'"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

  # --- Auth-edge stack ---

  permissions:
    <<: *common
    image: ghcr.io/berserkdb/permissions:v1.0.122
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *common-env
      PERMISSIONS_BIND: "0.0.0.0:9580"
      PERMISSIONS_DATABASE_URL: "postgres://berserk:berserk@postgres:5432/berserk"
      PERMISSIONS_SERVICE_TOKEN: "local-dev-permissions-service-token"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9580'"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

  gateway:
    <<: *common
    image: ghcr.io/berserkdb/gateway:v1.0.122
    depends_on:
      postgres:
        condition: service_healthy
      permissions:
        condition: service_healthy
      ui:
        condition: service_healthy
    environment:
      <<: *common-env
      GATEWAY_DATABASE_URL: "postgres://berserk:berserk@postgres:5432/berserk"
      GATEWAY_PERMISSIONS_SERVICE_TOKEN: "local-dev-permissions-service-token"
      GATEWAY_SERVICE_TOKEN: "local-dev-gateway-service-token"
      # 64-byte placeholder for localhost dev. In production set
      # this to a high-entropy random string and treat as a secret —
      # rotating it invalidates every active session.
      GATEWAY_COOKIE_SIGNING_KEY: "local-dev-gateway-cookie-signing-key-must-be-at-least-64-bytes-long!!"
    command: ["-c", "/config/config.yaml"]
    ports:
      - "9500:9500"
    configs:
      - source: gateway-config
        target: /config/config.yaml
        mode: 0444
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9500'"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

networks:
  berserk:
    driver: bridge

volumes:
  postgres-data:
  minio-data:
  query-cache:
  ingest-token:
  janitor-cache:
  nursery-workdir:
