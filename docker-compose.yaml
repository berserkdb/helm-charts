# Berserk local development stack
# Derived from charts/berserk helm chart
#
# Usage:
#   docker compose up -d
#   docker compose logs -f
#   docker compose down -v  # removes volumes too
#
#   # 1) Grab the one-time admin setup URL from the gateway logs:
#   docker compose logs gateway | grep -A1 "Initial admin setup"
#
#   # 2) Open it in a browser. Host ports are published on 127.0.0.1
#   # only so a git worktree on 127.1.x.y can bind the same canonical
#   # ports; localhost still reaches that IPv4 bind:
#   open http://localhost:${HOST_GATEWAY_PORT:-9500}
#
#   If 9500 is already taken (a `mise run dev` worktree, another
#   compose stack), remap without editing this file:
#     HOST_GATEWAY_PORT=19500 docker compose up -d
#   A compose `ports:` merge cannot unbind 9500 — set HOST_GATEWAY_PORT
#   (or `!override` the mapping) rather than adding a second host port.
#
#   # 3) Authenticate the CLI through the gateway. Match the CLI to
#   this compose tag; go.bzrk.dev tracks latest stable and can lag an rc:
#   bzrk profile add local --endpoint http://localhost:${HOST_GATEWAY_PORT:-9500}
#   bzrk profile use local
#   bzrk login
#   bzrk search "default | take 10" --since "1h ago"
#
# Requires Docker Compose v2.23.1+ (for inline configs).
#
# Image tags are pinned to a release. The ui image is Phoenix
# (`bzrk_explore`); it serves both the data-plane and workspace-admin
# surfaces. If your local Docker daemon can't reach those tags yet,
# build from source via `bazel run //apps/<svc>:<svc>_tarball` for
# each service — they tag as `berserk/<svc>-dev:dev`, and an
# operator-side `image:` override switches compose onto them.
#
# Berserk is pre-release (beta) software, provided AS IS with no warranty.
# By running this stack you agree to the Berserk Terms of Use:
#   https://www.bzrk.dev/legal/pre-release-license-terms/
# Each service image also carries the terms at /usr/share/doc/berserk/NOTICE.md.

# Cap container stdout/stderr so a long-running stack can't fill the host
# disk with accumulated log noise: 10 MB × 5 files = 50 MB max per container.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# One master key for the stack. The gateway's cookie key, the service-to-service
# tokens, the ui's secret_key_base, the default ingest token and the key that
# wraps the ui's data key all derive from it (docs/dev/master-key.md), so every
# service below gets the same value. Localhost placeholder: in production
# generate one (`openssl rand -base64 32`), at least 32 bytes, and treat it as
# a secret. Changing it logs every user out; rotating it is a two-key swap.
x-master-key: &master-key "local-dev-master-key-0123456789abcdef0123456789abcdef"

x-common: &common
  restart: unless-stopped
  logging: *logging
  networks:
    - berserk
  # Merge-heavy services (janitor, nursery) and the query cache open many
  # fds; k8s/containerd defaults to ~1M but the Docker daemon default is not
  # guaranteed, so set it explicitly for compose deployments.
  ulimits:
    nofile:
      soft: 1048576
      hard: 1048576
  environment: &common-env
    RUST_BACKTRACE: "1"
    # Every service below also sets POD_IP to its own compose service name:
    # services bind 0.0.0.0 and register `http://$POD_IP:<port>` in meta's
    # fleet registry (the chart fills it from the downward API), which is how
    # the query coordinator finds its workers and the nursery's query lane.

configs:
  meta-config:
    content: |
      bind: "0.0.0.0:9560"
      database_url: $${META_DATABASE_URL}
      storage_endpoint: "http://minio:9000"
      storage_bucket: "berserk"
      storage_region: "us-east-1"
      # The vector-index write gate (docs/dev/vidx-index-implementation.md):
      # the floor every worker must report, which the chart sets per
      # deployment, and the settling window before writes open. The window
      # guards rolling upgrades, which one node never has, so it is a minute
      # here; meta refuses anything shorter than its membership TTLs.
      vidx_floor: 1
      vidx_window_secs: 60
      observability:
        service_name: "meta"
        log_level: "info"
        otlp_enabled: true
        otlp_endpoint: "ingest:4317"

  query-config:
    content: |
      bind: "0.0.0.0:9510"
      meta_endpoint: "http://meta:9560"
      # Fan out to each nursery's NurseryQueryService for un-merged baby
      # segments before they merge to S3 — without this, freshly ingested
      # data isn't queryable until a merge lands (minutes, not seconds).
      # Paired with the nursery's query_grpc_bind below; mirrors
      # query.config.queryViaNursery in the helm chart.
      #
      # The chart's production transport: the service forks a qws worker that
      # registers `http://$$POD_IP:9520` in meta's registry, and reads through
      # the forked cache server. The nursery lane only exists on this transport.
      transport: "grpc"
      cache_mode: "remote"
      query_via_nursery: true
      cloud_storage_access_key: $${AWS_ACCESS_KEY_ID:}
      cloud_storage_secret_key: $${AWS_SECRET_ACCESS_KEY:}
      cache:
        dir: "/segment_cache"
      # One cache-disk budget the service splits between the segment and
      # result caches, as the chart sets it; the forked cache server needs an
      # explicit size inside a container.
      cache_total_size: "10GiB"
      observability:
        service_name: "query"
        log_level: "info"
        otlp_enabled: true
        otlp_endpoint: "ingest:4317"

  ingest-config:
    content: |
      meta_endpoint: "http://meta:9560"

      http_bind: "0.0.0.0:4318"
      grpc_bind: "0.0.0.0:4317"
      health_bind: "0.0.0.0:9550"

      require_auth: false
      lax_utf8: true

      loki_enabled: false

      max_batch_bytes: 16777216
      max_batch_age_secs: 2
      keep_alive_interval_secs: 120

      observability:
        service_name: "ingest"
        log_level: "info"
        otlp_enabled: true
        otlp_endpoint: "ingest:4317"

  janitor-config:
    content: |
      bind: "0.0.0.0:9502"
      meta_endpoint: "http://meta:9560"
      query_endpoint: "http://query:9510"
      cloud_storage_access_key: $${JANITOR_STORAGE_ACCESS_KEY:}
      cloud_storage_secret_key: $${JANITOR_STORAGE_SECRET_KEY:}
      # Idle re-poll cadence, as the chart defaults it. It is also how often
      # the janitor polls meta for merge tasks, which the vector-index write
      # gate must see within its grant period before it opens.
      merger:
        interval_seconds: 10
      observability:
        service_name: "janitor"
        log_level: "info"
        otlp_enabled: true
        otlp_endpoint: "ingest:4317"
      # Probe canary off, matching the Helm chart default. Explicit [] rather
      # than an absent key: the pinned image predates the empty compiled-in
      # default, and omitting the key there re-enables one probe.
      probe_jobs: []

  nursery-config:
    content: |
      http_bind: "0.0.0.0:9530"
      meta_endpoint: "http://meta:9560"
      cloud_storage_access_key: $${NURSERY_STORAGE_ACCESS_KEY:}
      cloud_storage_secret_key: $${NURSERY_STORAGE_SECRET_KEY:}
      working_dir: "/var/cache/nursery"
      meta_default_poll_interval_secs: 5
      stream_timeout_secs: 300
      # Query-in-nursery lane: serve un-merged baby segments to the query
      # coordinator's fan-out (paired with query's query_via_nursery) so fresh
      # data is queryable before it merges to S3. qws_bin is bundled at
      # /qws_bin in the nursery image; the member endpoint advertises the
      # compose service name where the chart uses the pod IP. The merge age
      # trigger keeps the un-merged tail short. Mirrors the nursery helm chart.
      #
      # NOTE: this file runs the *released* images pinned above, not the working
      # tree, so every key here has to be one those binaries understand; a key
      # they do not know is silently ignored.
      query_grpc_bind: "0.0.0.0:9531"
      qws_bin: "/qws_bin"
      query_grpc_member_endpoint: "http://nursery:9531"
      merge_age_trigger_secs: 60
      observability:
        service_name: "nursery"
        log_level: "info"
        otlp_enabled: true
        otlp_endpoint: "ingest:4317"

  gateway-config:
    content: |
      bind: "0.0.0.0:9500"
      public_base_url: "http://localhost:${HOST_GATEWAY_PORT:-9500}"
      cookie_secure: false
      upstream_base_url: "http://ui:9570"
      permissions_base_url: "http://permissions:9580"
      deployment_mode: self_hosted
      grpc_routes: '[{"package_prefix":"meta","upstream":"http://meta:9560"},{"package_prefix":"query","upstream":"http://query:9510"},{"package_prefix":"opentelemetry","upstream":"http://ingest:4317"}]'
      session_ttl_secs: 1209600
      invite_ttl_secs: 604800
      reset_ttl_secs: 3600
      oidc_challenge_ttl_secs: 600
      grant_outbox_tick_secs: 5
      grant_outbox_retry_delay_secs: 5
      grant_outbox_batch_size: 50
      session_cleanup_interval_secs: 3600
      observability:
        service_name: "gateway"
        log_level: "info"
        otlp_enabled: true
        otlp_endpoint: "ingest:4317"

  # No bootstrap SQL needed: as of v1.0.112, gateway / ui /
  # permissions share the meta DB and isolate themselves via the
  # `auth` schema (gateway creates the schema on first boot and
  # pins every connection's `search_path` to it). sqlx puts
  # `_sqlx_migrations` in the first writable schema on the
  # connection's search_path, so `auth._sqlx_migrations` and
  # `public._sqlx_migrations` coexist without collision.

services:
  # --- Infrastructure ---

  postgres:
    image: postgres:17
    logging: *logging
    networks:
      - berserk
    environment:
      POSTGRES_USER: berserk
      POSTGRES_PASSWORD: berserk
      POSTGRES_DB: berserk
    # Host publishes bind 127.0.0.1 only. Implied 0.0.0.0 occupies every
    # interface — including a git worktree's 127.1.x.y — so `mise run dev`
    # in a linked worktree cannot bind the same canonical ports. Inside the
    # container, services still listen on 0.0.0.0.
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U berserk"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # MinIO stopped publishing community binaries and images in October 2025;
  # these are the community rebuilds from the MinIO source that the dev
  # scenario pins as well (github.com/golithus/minio-builds, AGPL-3.0). The
  # image carries only the binary, so readiness is checked by minio-init.
  minio:
    image: ghcr.io/golithus/minio:RELEASE.2025-10-15T17-29-55Z
    logging: *logging
    networks:
      - berserk
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"  # MinIO Console
    volumes:
      - minio-data:/data
    restart: unless-stopped

  # Wait for MinIO, then create the default bucket. The services wait for
  # this to finish, which is what makes MinIO's readiness matter. The alias
  # comes from the environment because `mc alias set` connects at once and
  # fails if MinIO is still starting.
  minio-init:
    image: ghcr.io/golithus/mc:RELEASE.2025-08-13T08-35-41Z
    logging: *logging
    networks:
      - berserk
    depends_on:
      minio:
        condition: service_started
    environment:
      MC_HOST_local: http://minioadmin:minioadmin@minio:9000
    entrypoint: >
      /bin/sh -c "
      until mc ready local; do sleep 1; done &&
      mc mb --ignore-existing local/berserk &&
      echo 'Bucket created successfully'
      "
    restart: "no"

  # Fix volume ownership for UID 1000 (mirrors Helm fsGroup: 1000)
  volume-init:
    image: alpine:latest
    logging: *logging
    entrypoint: /bin/sh -c "chown -R 1000:1000 /mnt/*"
    volumes:
      - query-cache:/mnt/query-cache
      - janitor-cache:/mnt/janitor-cache
      - nursery-workdir:/mnt/nursery-workdir
    restart: "no"

  # --- Berserk Services ---

  meta:
    <<: *common
    image: images.bzrk.dev/release/meta:v1.1.10-rc.6
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *common-env
      POD_IP: meta
      META_DATABASE_URL: "postgres://berserk:berserk@postgres:5432/berserk"
      # Registers the default ingest token (derived from the key) and creates
      # the `default` table on first boot; ingest derives the same token.
      BZRK_MASTER_KEY: *master-key
    command: ["-c", "/config/config.yaml"]
    ports:
      - "127.0.0.1:9560:9560"
    configs:
      - source: meta-config
        target: /config/config.yaml
        mode: 0444
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9560'"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

  query:
    <<: *common
    image: images.bzrk.dev/release/query:v1.1.10-rc.6
    depends_on:
      meta:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      volume-init:
        condition: service_completed_successfully
    environment:
      <<: *common-env
      POD_IP: query
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      # The forked qws worker inherits this env and reads segments itself, so
      # it needs the object store the way the chart's query container has it.
      BZRK_QWS_EMBEDDED_BIND: "0.0.0.0:9520"
      BZRK_QWS_CLOUD_STORAGE_ENDPOINT: "http://minio:9000"
      BZRK_QWS_CLOUD_STORAGE_USE_SSL: "false"
      BZRK_QWS_CLOUD_STORAGE_ACCESS_KEY: minioadmin
      BZRK_QWS_CLOUD_STORAGE_SECRET_KEY: minioadmin
    command: ["-c", "/config/config.yaml"]
    ports:
      - "127.0.0.1:9510:9510"
    configs:
      - source: query-config
        target: /config/config.yaml
        mode: 0444
    volumes:
      - query-cache:/segment_cache
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9510'"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

  # Pushes without a bearer token land in the `default` table through the
  # default ingest token, which meta registers at boot and ingest derives
  # from the same master key (`require_auth: false` above keeps that path
  # open). Senders with a token of their own are routed by that token.
  ingest:
    <<: *common
    image: images.bzrk.dev/release/ingest:v1.1.10-rc.6
    depends_on:
      meta:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      volume-init:
        condition: service_completed_successfully
    command: ["-c", "/config/config.yaml"]
    environment:
      RUST_LOG: info
      POD_IP: ingest
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      BZRK_MASTER_KEY: *master-key
      DEFAULT_INGEST_TOKEN_ENABLED: "true"
    ports:
      - "127.0.0.1:14317:4317"   # OTLP gRPC
      - "127.0.0.1:14318:4318"   # OTLP HTTP
      - "127.0.0.1:19550:9550"   # Health
    configs:
      - source: ingest-config
        target: /config/config.yaml
        mode: 0444
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9550'"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

  janitor:
    <<: *common
    image: images.bzrk.dev/release/janitor:v1.1.10-rc.6
    depends_on:
      meta:
        condition: service_healthy
      query:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      volume-init:
        condition: service_completed_successfully
    environment:
      <<: *common-env
      POD_IP: janitor
      JANITOR_STORAGE_ACCESS_KEY: minioadmin
      JANITOR_STORAGE_SECRET_KEY: minioadmin
    command: ["-c", "/config/config.yaml"]
    configs:
      - source: janitor-config
        target: /config/config.yaml
        mode: 0444
    volumes:
      - janitor-cache:/tmp/segment-cache
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9502'"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 10

  nursery:
    <<: *common
    image: images.bzrk.dev/release/nursery:v1.1.10-rc.6
    depends_on:
      meta:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      volume-init:
        condition: service_completed_successfully
    environment:
      <<: *common-env
      POD_IP: nursery
      NURSERY_STORAGE_ACCESS_KEY: minioadmin
      NURSERY_STORAGE_SECRET_KEY: minioadmin
    command: ["-c", "/config/config.yaml"]
    configs:
      - source: nursery-config
        target: /config/config.yaml
        mode: 0444
    volumes:
      - nursery-workdir:/var/cache/nursery
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9530'"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 10

  ui:
    <<: *common
    image: images.bzrk.dev/release/ui:v1.1.10-rc.6
    depends_on:
      postgres:
        condition: service_healthy
      query:
        condition: service_healthy
      meta:
        condition: service_healthy
      permissions:
        condition: service_healthy
    environment:
      <<: *common-env
      PHX_SERVER: "true"
      PORT: "9570"
      PHX_HOST: localhost
      PHX_BIND_IP: "0.0.0.0"
      PHX_CHECK_ORIGIN: "http://localhost:${HOST_GATEWAY_PORT:-9500},http://127.0.0.1:${HOST_GATEWAY_PORT:-9500}"
      DATABASE_URL: "postgres://berserk:berserk@postgres:5432/berserk"
      UI_PHOENIX_DATABASE_SCHEMA: webui
      BZRK_MASTER_KEY: *master-key
      QUERY_GRPC_ENDPOINT: "query:9510"
      META_GRPC_ENDPOINT: "meta:9560"
      GATEWAY_HTTP_ENDPOINT: "http://gateway:9500"
      PERMISSIONS_HTTP_ENDPOINT: "http://permissions:9580"
      BZRK_INGEST_HOST: localhost
      BZRK_INGEST_GRPC_PORT: "14317"
      BZRK_INGEST_HTTP_PORT: "14318"
      BZRK_INGEST_TLS: "false"
      BZRK_COLLECTOR_ENABLED: "false"
    # Image entrypoint migrates, then starts the HTTP server. Do not
    # override command with a yaml config path — that is not how this
    # image boots.
    # ui is no longer the public entry point — gateway fronts it.
    # Leave the internal port unmapped; debugging is via
    # `docker compose exec ui` or `docker compose port ui 9570`.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9570'"]
      interval: 5s
      timeout: 3s
      start_period: 40s
      retries: 12

  # --- Auth-edge stack ---

  permissions:
    <<: *common
    image: images.bzrk.dev/release/permissions:v1.1.10-rc.6
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *common-env
      POD_IP: permissions
      PERMISSIONS_BIND: "0.0.0.0:9580"
      PERMISSIONS_DATABASE_URL: "postgres://berserk:berserk@postgres:5432/berserk"
      BZRK_MASTER_KEY: *master-key
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9580'"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

  gateway:
    <<: *common
    image: images.bzrk.dev/release/gateway:v1.1.10-rc.6
    depends_on:
      postgres:
        condition: service_healthy
      permissions:
        condition: service_healthy
      ui:
        condition: service_healthy
    environment:
      <<: *common-env
      POD_IP: gateway
      GATEWAY_DATABASE_URL: "postgres://berserk:berserk@postgres:5432/berserk"
      BZRK_MASTER_KEY: *master-key
    command: ["-c", "/config/config.yaml"]
    ports:
      - "127.0.0.1:${HOST_GATEWAY_PORT:-9500}:9500"
    configs:
      - source: gateway-config
        target: /config/config.yaml
        mode: 0444
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9500'"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

networks:
  berserk:
    driver: bridge

volumes:
  postgres-data:
  minio-data:
  query-cache:
  janitor-cache:
  nursery-workdir:
