name: Release Charts

on:
  push:
    branches:
      - main

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

  notify-failure:
    name: Discord Failure Notification
    runs-on: ubuntu-latest
    needs: [release]
    if: failure()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "${DISCORD_WEBHOOK}" ]; then
            echo "DISCORD_WEBHOOK secret not set; skipping notification"
            exit 0
          fi

          STATUS_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          COMMIT_MSG=$(git log --format=%s -n 1 "${GITHUB_SHA}")

          MSG="❌ **helm-charts Release** failed"
          MSG="${MSG}"$'\n'"commit: \`${GITHUB_SHA::7}\` ${COMMIT_MSG}"
          MSG="${MSG}"$'\n'"[View Details](<${STATUS_URL}>)"

          JSON_PAYLOAD=$(jq -n --arg msg "$MSG" '{content: $msg}')

          curl -H "Content-Type: application/json" -X POST "$DISCORD_WEBHOOK" \
            -d "$JSON_PAYLOAD"
