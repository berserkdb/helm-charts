name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - "charts/**"
      - "ci/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "charts/**"
      - "ci/**"
      - ".github/workflows/ci.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Build Helm dependencies
        run: |
          for chart in charts/berserk/charts/meta charts/berserk/charts/query charts/berserk/charts/ingest charts/berserk/charts/janitor charts/berserk/charts/ui charts/berserk/charts/nursery; do
            helm dependency update "$chart"
          done
          helm dependency update charts/berserk

      - name: Helm template (validates all templates render)
        run: helm template berserk charts/berserk -f ci/values-ci.yaml > /dev/null

  integration:
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: berserk-ci

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Create test namespace
        run: kubectl create namespace berserk-test

      - name: Install PostgreSQL
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm install postgres bitnami/postgresql \
            --namespace berserk-test \
            --set auth.postgresPassword=testpassword \
            --set auth.database=berserk \
            --set primary.resources.requests.memory=128Mi \
            --set primary.resources.requests.cpu=100m \
            --wait --timeout 120s

      # postgres-credentials is externally managed in prod/dev; ci/values-ci.yaml
      # sets postgresCredentials.managed=false and the ui migrate pre-install hook
      # reads this secret, so it must exist before `helm install` (a chart-managed
      # secret would only appear after pre-install hooks run). Mirrors
      # tools/scripts/kind-up.sh in the source repo.
      - name: Create postgres-credentials secret
        run: |
          kubectl create secret generic postgres-credentials \
            --namespace berserk-test \
            --from-literal=database_url='postgres://postgres:testpassword@postgres-postgresql:5432/berserk?sslmode=disable' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy MinIO
        run: |
          kubectl apply -n berserk-test -f - <<'EOF'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: minio
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: minio
            template:
              metadata:
                labels:
                  app: minio
              spec:
                containers:
                  - name: minio
                    image: pgsty/minio:latest
                    args: ["server", "/data"]
                    env:
                      - name: MINIO_ROOT_USER
                        value: minioadmin
                      - name: MINIO_ROOT_PASSWORD
                        value: minioadmin
                    ports:
                      - containerPort: 9000
                    resources:
                      requests:
                        memory: "128Mi"
                        cpu: "100m"
                    readinessProbe:
                      httpGet:
                        path: /minio/health/ready
                        port: 9000
                      initialDelaySeconds: 5
                      periodSeconds: 5
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: minio
          spec:
            selector:
              app: minio
            ports:
              - port: 9000
                targetPort: 9000
          EOF
          kubectl wait deployment/minio -n berserk-test --for=condition=Available --timeout=120s

      - name: Create MinIO bucket
        run: |
          kubectl run minio-init -n berserk-test --rm -i --restart=Never \
            --image=minio/mc:latest \
            --command -- sh -c '
              mc alias set ci http://minio:9000 minioadmin minioadmin &&
              mc mb ci/berserk-test
            '

      - name: Build Helm dependencies
        run: |
          for chart in charts/berserk/charts/meta charts/berserk/charts/query charts/berserk/charts/ingest charts/berserk/charts/janitor charts/berserk/charts/ui charts/berserk/charts/nursery; do
            helm dependency update "$chart"
          done
          helm dependency update charts/berserk

      - name: Install Berserk chart
        run: |
          helm install berserk charts/berserk \
            --namespace berserk-test \
            -f ci/values-ci.yaml \
            --set global.imageCredentials.username="${{ github.actor }}" \
            --set global.imageCredentials.password="${{ secrets.GITHUB_TOKEN }}" \
            --timeout 300s

      - name: Wait for deployments
        run: |
          for deploy in meta ingest janitor nursery ui query; do
            echo "Waiting for deployment/$deploy..."
            kubectl wait deployment/"$deploy" \
              --namespace berserk-test \
              --for=condition=Available \
              --timeout=180s
          done

      - name: Run Helm tests
        run: |
          helm test berserk \
            --namespace berserk-test \
            --timeout 180s

      - name: Debug on failure
        if: failure()
        run: |
          echo "=== Pod status ==="
          kubectl get pods -n berserk-test -o wide
          echo ""
          echo "=== Events ==="
          kubectl get events -n berserk-test --sort-by='.lastTimestamp'
          echo ""
          for pod in $(kubectl get pods -n berserk-test -o name); do
            echo "=== Logs: $pod ==="
            kubectl logs "$pod" -n berserk-test --tail=50 || true
          done
          echo ""
          echo "=== Describe failing pods ==="
          kubectl describe pods -n berserk-test --field-selector=status.phase!=Running || true

      - name: Discord Failure Notification
        if: failure() && github.ref == 'refs/heads/main'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "${DISCORD_WEBHOOK}" ]; then
            echo "DISCORD_WEBHOOK secret not set; skipping notification"
            exit 0
          fi

          STATUS_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          COMMIT_MSG=$(git log --format=%s -n 1 "${GITHUB_SHA}")

          MSG="❌ **helm-charts CI** failed"
          MSG="${MSG}"$'\n'"commit: \`${GITHUB_SHA::7}\` ${COMMIT_MSG}"
          MSG="${MSG}"$'\n'"[View Details](<${STATUS_URL}>)"

          JSON_PAYLOAD=$(jq -n --arg msg "$MSG" '{content: $msg}')

          curl -H "Content-Type: application/json" -X POST "$DISCORD_WEBHOOK" \
            -d "$JSON_PAYLOAD"
