# Full example values.yaml for a production Berserk deployment.
# Adjust replica counts, resource limits, and cache sizes to match your workload.
# These settings assume that secrets are managed externally and that S3 credentials are provided via environment variables or IRSA.
# See http://docs.bzrk.dev/operations/deployment/#external-secrets
global:
  storage:
    endpoint: "https://s3.example.com"
    bucket: "berserk-data"
    region: "us-east-1"
  observability:
    otlpEnabled: true
    otlpEndpoint: "ingest:4317"
  # Node scheduling constraints (applied to all services unless overridden per-service)
  # nodeSelector:
  #   disktype: ssd
  # tolerations:
  #   - key: "dedicated"
  #     operator: "Equal"
  #     value: "berserk"
  #     effect: "NoSchedule"
  # affinity: {}

query:
  replicaCount: 1
  cache:
    size: "256GiB"
  resources:
    requests:
      memory: "4Gi"
      cpu: "4000m"
    limits:
      memory: "64Gi"
      cpu: "32000m"

ingest:
  replicaCount: 2
  resources:
    requests:
      memory: "1Gi"
      cpu: "1000m"
    limits:
      memory: "16Gi"
      cpu: "8000m"
