# An example with Traefik-based ingress; single sign-on is set up on the
# settings page afterwards, not in these values.
global:
  clusterName: "prod-cluster" # Used in telemetry
  # Public URL of the install — inherited by gateway + admin-ui.
  publicBaseUrl: "https://berserk.<your-domain>.com"
  storage:
    endpoint: "https://s3.example.com"
    bucket: "berserk-data"
    region: "us-east-1"
    # Add this path, if you want a prefix in the bucket.
    path: "path_prefix"
  s3Credentials:
    managed: true # S3 access via IRSA (serviceAccountName below)
  postgresCredentials:
    managed: true
  ingestToken:
    managed: false
  observability:
    # Ship the Berserk services' own telemetry (logs/traces/metrics) to the
    # and OTLP-enabled endpoint
    otlpEnabled: true
  networkPolicy:
    enabled: true
  # This is the default table, where the telemetry ends up.
  defaultTable: "default"

# ─── Data plane ───────────────────────────────────────────────────────
ingest:
  # OTLP gRPC (4317). With this, you can
  # enable ingress to the ingest service via e.g., Traefik
  ingress:
    enabled: true
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      traefik.ingress.kubernetes.io/router.entrypoints: otlp
    hosts:
      - host: "ingest.berserk.<your-domain>.com"
        paths:
          # Only forward the OTLP collector methods (trace/metrics/logs Export all share
          - path: /opentelemetry.proto.collector.
            pathType: ImplementationSpecific
            portName: otlp-grpc
    tls:
      - hosts: ["ingest.berserk.<your-domain>.com"]
        secretName: ingest-berserk-<your-domain>-tls

# ─── Auth edge ────────────────────────────────────────────────────────
# The gateway is the service that signs users in. The first admin is a
# local account: by default the gateway prints a one-time setup link at
# its first start, or it creates the admin from `bootstrap` below. That
# admin connects your identity provider on Settings → Single sign-on,
# then adds SSO members by email or invites local ones on Settings →
# Members.
gateway:
  bootstrap:
    adminEmail: "admin@<your-domain>.com"
    adminGivenName: "Cluster"
    adminFamilyName: "Admin"
    # adminPassword: pass it with --set at install, so it stays out of the file.
