# Full example values.yaml for a production Berserk deployment.
# Adjust replica counts, resource limits, and cache sizes to match your workload.
# These settings assumes that secrets are passed on helm install and Helm will then manage
# the secrets.
# See http://docs.bzrk.dev/operations/deployment/#helm-managed-secrets

global:
  storage:
    endpoint: "https://s3.example.com"
    bucket: "berserk-data"
    region: "us-east-1"
  s3Credentials:
    managed: true
  postgresCredentials:
    managed: true
  imageCredentials:
    managed: true
  observability:
    otlpEnabled: true
    otlpEndpoint: "ingest:4317"

query:
  replicaCount: 1
  cache:
    size: "256GiB"
  resources:
    requests:
      memory: "4Gi"
      cpu: "4000m"
    limits:
      memory: "64Gi"
      cpu: "32000m"

ingest:
  replicaCount: 2
  resources:
    requests:
      memory: "1Gi"
      cpu: "1000m"
    limits:
      memory: "16Gi"
      cpu: "8000m"
