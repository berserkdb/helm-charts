{{- /*
Runs a query the way a user does: signed in at the gateway, which forwards it to
query with a token query trusts. Query refuses anything the gateway did not sign,
so the test needs a credential, and the only one a fresh install has is the
bootstrap admin. Without a bootstrap password there is no query test.

The bootstrap admin is break-glass, which may change access but holds no database
rules, and a new cluster binds no one (docs/dev/access-control.md). So when the
admin may not query yet, it binds itself to `observer` first, as an operator
setting up the cluster does. An admin that may already query is left as it is.
*/ -}}
{{- $bootstrap := .Values.gateway.bootstrap }}
{{- if and .Values.query.enabled .Values.gateway.enabled $bootstrap.adminEmail (or $bootstrap.adminPassword $bootstrap.existingSecret.name) }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "berserk.fullname" . }}-test-query
  labels:
    {{- include "berserk.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
  restartPolicy: Never
  containers:
    - name: test-query
      # curl, not busybox: busybox's wget cannot send the PUT that binds a role.
      image: curlimages/curl:8.10.1
      securityContext:
        allowPrivilegeEscalation: false
      env:
        - name: ADMIN_EMAIL
          value: {{ $bootstrap.adminEmail | quote }}
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ $bootstrap.existingSecret.name | default "gateway-bootstrap-admin" }}
              key: {{ $bootstrap.existingSecret.key | default "bootstrap_admin_password" }}
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          GATEWAY="http://gateway:{{ .Values.gateway.service.port }}"

          echo "Waiting for the gateway to be ready..."
          until curl -sf -o /dev/null "${GATEWAY}/health/ready"; do
            echo "Gateway not ready yet, retrying in 3s..."
            sleep 3
          done

          # --variable reads the environment, so the password never reaches argv.
          echo "Signing in as ${ADMIN_EMAIL}..."
          if ! curl -sS -f -o /dev/null -D /tmp/login.headers \
            -H "Content-Type: application/json" \
            --variable %ADMIN_EMAIL --variable %ADMIN_PASSWORD \
            --expand-data '{"email": "{{ "{{" }}ADMIN_EMAIL:json{{ "}}" }}", "password": "{{ "{{" }}ADMIN_PASSWORD:json{{ "}}" }}"}' \
            "${GATEWAY}/auth/login"; then
            echo "FAILED: the bootstrap admin could not sign in at the gateway"
            exit 1
          fi
          SESSION=$(sed -n 's/^ *[Ss]et-[Cc]ookie: *\([^;]*\).*/\1/p' /tmp/login.headers | head -n 1)
          if [ -z "${SESSION}" ]; then
            echo "FAILED: the gateway signed the admin in but set no session cookie"
            exit 1
          fi

          CAN_QUERY=$(curl -sS -f \
            -H "Cookie: ${SESSION}" \
            -H "Content-Type: application/json" \
            --data '{"kind": "databases", "verb": "query"}' \
            "${GATEWAY}/api/access/can-i")
          case "${CAN_QUERY}" in
            *'"allowed":true'*)
              echo "The admin may already query; its bindings are left as they are."
              ;;
            *)
              echo "The admin may not query yet; binding it to observer..."
              curl -sS -f -o /dev/null -X PUT \
                -H "Cookie: ${SESSION}" \
                -H "Content-Type: application/json" \
                --data '{"roles": ["observer"]}' \
                --variable %ADMIN_EMAIL \
                --expand-url "${GATEWAY}/api/access/bindings/users/{{ "{{" }}ADMIN_EMAIL:url{{ "}}" }}"
              ;;
          esac

          echo "Running through the gateway: {{ .Values.global.defaultTable }} | take 1"
          RESPONSE=$(curl -sS -f \
            -H "Cookie: ${SESSION}" \
            -H "Content-Type: application/json" \
            --data '{"db": "{{ .Values.global.defaultDatabase | default "default" }}", "csl": "{{ .Values.global.defaultTable }} | take 1"}' \
            "${GATEWAY}/v1/rest/query")

          echo "Response: ${RESPONSE}"
          echo "${RESPONSE}" | grep -q '"Tables"'
          echo "PASSED: a query through the gateway returned Tables"
{{- end }}
