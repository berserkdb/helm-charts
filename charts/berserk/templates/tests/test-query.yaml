{{- /*
Runs a query the way a user does: signed in at the gateway, which forwards it to
query with a token query trusts. Query refuses anything the gateway did not sign,
so the test needs a credential, and the only one a fresh install has is the
bootstrap admin. Without a bootstrap password there is no query test.

The bootstrap admin creates a temporary service account with direct query access
only to system.logs, then removes it. No policy role names or user bindings change.
*/ -}}
{{- $bootstrap := .Values.gateway.bootstrap }}
{{- if and .Values.query.enabled .Values.gateway.enabled $bootstrap.adminEmail (or $bootstrap.adminPassword $bootstrap.existingSecret.name) }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "berserk.fullname" . }}-test-query
  labels:
    {{- include "berserk.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
  restartPolicy: Never
  containers:
    - name: test-query
      # curl supports the account-management requests and reads credentials from the environment.
      image: curlimages/curl:8.10.1
      securityContext:
        allowPrivilegeEscalation: false
      env:
        - name: ADMIN_EMAIL
          value: {{ $bootstrap.adminEmail | quote }}
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ $bootstrap.existingSecret.name | default "gateway-bootstrap-admin" }}
              key: {{ $bootstrap.existingSecret.key | default "bootstrap_admin_password" }}
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          GATEWAY="http://gateway:{{ .Values.gateway.service.port }}"

          echo "Waiting for the gateway to be ready..."
          until curl -sf -o /dev/null "${GATEWAY}/health/ready"; do
            echo "Gateway not ready yet, retrying in 3s..."
            sleep 3
          done

          # --variable reads the environment, so the password never reaches argv.
          echo "Signing in as ${ADMIN_EMAIL}..."
          if ! curl -sS -f -o /dev/null -D /tmp/login.headers \
            -H "Content-Type: application/json" \
            --variable %ADMIN_EMAIL --variable %ADMIN_PASSWORD \
            --expand-data '{"email": "{{ "{{" }}ADMIN_EMAIL:json{{ "}}" }}", "password": "{{ "{{" }}ADMIN_PASSWORD:json{{ "}}" }}"}' \
            "${GATEWAY}/auth/login"; then
            echo "FAILED: the bootstrap admin could not sign in at the gateway"
            exit 1
          fi
          SESSION=$(sed -n 's/^ *[Ss]et-[Cc]ookie: *\([^;]*\).*/\1/p' /tmp/login.headers | head -n 1)
          if [ -z "${SESSION}" ]; then
            echo "FAILED: the gateway signed the admin in but set no session cookie"
            exit 1
          fi

          QUERY_ACCOUNT_NAME="helm-query-$(cat /proc/sys/kernel/random/uuid)"
          curl -sS -f -o /dev/null \
            -H "Cookie: ${SESSION}" -H "Content-Type: application/json" \
            --data "{\"name\": \"${QUERY_ACCOUNT_NAME}\"}" \
            "${GATEWAY}/api/service-principals"
          cleanup() {
            QUERY_TEST_STATUS=$?
            if ! curl -sS -f -o /dev/null -X DELETE -H "Cookie: ${SESSION}" \
              "${GATEWAY}/api/service-principals/${QUERY_ACCOUNT_NAME}"; then
              echo "FAILED: could not remove the temporary query account"
              QUERY_TEST_STATUS=1
            fi
            exit "${QUERY_TEST_STATUS}"
          }
          trap cleanup EXIT
          curl -sS -f -o /dev/null -X PUT \
            -H "Cookie: ${SESSION}" -H "Content-Type: application/json" \
            --data '{"roles": [], "privileges": "databases: [{names: [system], tables: [logs], privileges: [query]}]"}' \
            "${GATEWAY}/api/service-principals/${QUERY_ACCOUNT_NAME}/access"
          QUERY_TOKEN_EXPIRES=$(date -u -d "@$(($(date +%s) + 600))" +%Y-%m-%dT%H:%M:%SZ)
          QUERY_TOKEN_RESPONSE=$(curl -sS -f \
            -H "Cookie: ${SESSION}" -H "Content-Type: application/json" \
            --data "{\"name\": \"helm-query\", \"expires_at\": \"${QUERY_TOKEN_EXPIRES}\"}" \
            "${GATEWAY}/api/service-principals/${QUERY_ACCOUNT_NAME}/tokens")
          QUERY_TOKEN=$(printf '%s' "${QUERY_TOKEN_RESPONSE}" | sed -n 's/.*"token"[[:space:]]*:[[:space:]]*"\([^" ]*\)".*/\1/p')
          if [ -z "${QUERY_TOKEN}" ]; then
            echo "FAILED: the gateway returned no service-account token"
            exit 1
          fi
          export QUERY_TOKEN

          # Meta creates the system database in the background after it starts.
          echo "Running through the gateway, in the system database: logs | take 1"
          ATTEMPTS=0
          until RESPONSE=$(curl -sS -f \
            --variable %QUERY_TOKEN \
            --expand-header 'Authorization: Bearer {{ "{{" }}QUERY_TOKEN{{ "}}" }}' \
            -H "Content-Type: application/json" \
            --data '{"db": "system", "csl": "logs | take 1"}' \
            "${GATEWAY}/v1/rest/query"); do
            ATTEMPTS=$((ATTEMPTS + 1))
            if [ "${ATTEMPTS}" -ge 20 ]; then
              echo "FAILED: the query through the gateway kept failing"
              exit 1
            fi
            echo "Query failed, retrying in 3s..."
            sleep 3
          done

          echo "Response: ${RESPONSE}"
          echo "${RESPONSE}" | grep -q '"Tables"'
          echo "PASSED: a query through the gateway returned Tables"
{{- end }}
