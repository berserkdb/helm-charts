# Global configuration applied to all subcharts
global:
  # Image registry for all Berserk images
  imageRegistry: ghcr.io/berserkdb
  # Image pull policy
  imagePullPolicy: Always
  # Override image tag for all services (defaults to Chart appVersion)
  imageTag: ""
  # Image pull secrets (for private registry mirrors, air-gapped environments, etc.)
  imagePullSecrets: []
  # ServiceAccount name for pod specs (e.g. for IRSA on EKS)
  serviceAccountName: ""
  # Labels applied to all resources
  labels: {}
  # Name of this Berserk cluster (a Helm install / logical tenant). Stamped on
  # every telemetry record as `bzrk.cluster.name` so alerts and dashboards can
  # scope queries to one install when multiple installs share a k8s cluster
  # or share a Grafana backend. When empty, defaults to "default".
  # Override in per-env values files: "dev", "valhalla", etc.
  clusterName: ""
  # S3 storage configuration
  storage:
    endpoint: ""
    bucket: ""
    region: ""
  # S3 credentials secret configuration
  s3Credentials:
    # Set managed: true and provide accessKeyId/secretAccessKey to have the chart manage the secret
    managed: false
    secretName: "s3-credentials"
    accessKeyId: ""
    secretAccessKey: ""
    accessKeyIdKey: "AWS_ACCESS_KEY_ID"
    secretAccessKeyKey: "AWS_SECRET_ACCESS_KEY"
  # PostgreSQL credentials secret configuration
  postgresCredentials:
    # Set managed: true and provide databaseUrl to have the chart manage the secret
    managed: false
    secretName: "postgres-credentials"
    databaseUrl: ""
    databaseUrlKey: "database_url"
  # Ingest token configuration
  # Set managed: true to auto-create the token via an init container on the ingest service
  ingestToken:
    managed: false
    secretName: "ingest-token"
    key: "default_ingest_token"
    tokenName: "default_ingest_token"
  # Observability configuration (OTLP telemetry)
  observability:
    otlpEnabled: false
    otlpEndpoint: "ingest:4317"
  # Default database that the init-ingest-token container routes its
  # table + token into. Mirrors `defaultTable` — both default to the
  # `default` database/table that meta's migration 026 seeds.
  defaultDatabase: "default"
  # Default dataset name for Berserk
  defaultTable: "default"
  # NetworkPolicy configuration
  # Requires a CNI plugin that supports NetworkPolicy (Calico, Cilium, or
  # EKS VPC CNI v1.14+ with ENABLE_NETWORK_POLICY).
  networkPolicy:
    enabled: false
    # Additional ingress rules applied to ALL services
    additionalIngress: []
    # External egress destinations (S3, PostgreSQL, etc.)
    # Each entry: {cidr: "0.0.0.0/0", ports: [{port: 443, protocol: TCP}]}
    # Default allows HTTPS to anywhere -- tighten to your S3/DB CIDRs in production.
    externalEgress:
      - cidr: 0.0.0.0/0
        ports:
          - port: 443
            protocol: TCP
      - cidr: 0.0.0.0/0
        ports:
          - port: 5432
            protocol: TCP
    # OTLP egress rules used when global.observability.otlpEndpoint points
    # outside this Helm release's namespace. Each entry must specify either
    # `cidr` (external ipBlock) OR `namespace` + `podLabels` (cross-namespace
    # in-cluster peer). When using the default (ingest:4317), egress is
    # handled automatically and otlpEgress is ignored.
    otlpEgress: []
    # External collector via ipBlock:
    #  - cidr: 10.0.0.0/8
    #    ports:
    #      - port: 4317
    #        protocol: TCP
    # Cross-namespace in-cluster collector via namespace + pod selector:
    #  - namespace: observability
    #    podLabels:
    #      app: otel-collector
    #    ports:
    #      - port: 4317
    #        protocol: TCP
  # Node scheduling constraints (applied to all services unless overridden)
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Post-install setup job configuration
setup:
  # The init-ingest-token init container now ensures the dataset exists before
  # creating the token, so this job is only needed for installs without managed
  # ingest tokens.
  enabled: false
  image:
    repository: cli
    # tag: overrides global.imageTag

# Meta service configuration
meta:
  enabled: true
  replicaCount: 1

  image:
    repository: meta
    # tag: overrides global.imageTag

  service:
    type: ClusterIP
    port: 9500

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"

  config:
    # Storage configuration
    storageEndpoint: ""
    storageBucket: ""
    storageRegion: ""
    # Observability settings
    observability:
      serviceName: "meta"
      logLevel: "info"
      otlpEnabled: false
      otlpEndpoint: ""

# Query service configuration
query:
  enabled: true
  replicaCount: 1

  image:
    repository: query

  service:
    type: ClusterIP
    port: 9510

  # Segment cache configuration
  cache:
    enabled: true
    size: "128Gi"
    sizeLimit: "128GiB"

  resources:
    requests:
      memory: "1Gi"
      cpu: "2000m"
    limits:
      memory: "4Gi"
      cpu: "4000m"

  config:
    metaEndpoint: "http://meta:9500"
    observability:
      serviceName: "query"
      logLevel: "info"
      otlpEnabled: false
      otlpEndpoint: ""

# Ingest service configuration
ingest:
  enabled: true
  replicaCount: 1

  image:
    repository: ingest

  service:
    type: ClusterIP
    ports:
      otlpGrpc: 4317
      otlpHttp: 4318
      loki: 3100
      health: 9550

  # Disabled by default. Enable to expose ingest via a Kubernetes
  # Ingress controller. For OTLP gRPC on 4317, set the appropriate
  # backend-protocol annotation (nginx: "GRPC", traefik: "h2c"). A single
  # Ingress can fan out to gRPC and HTTP using per-path `portName`.
  # Full schema in charts/ingest/values.yaml.
  ingress:
    enabled: false

  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "4000m"

  config:
    metaEndpoint: "http://meta:9500"
    batch:
      maxBatchBytes: 16777216
      maxBatchAgeSecs: 2
      keepAliveIntervalSecs: 120
    requireAuth: false
    laxUtf8: true
    lokiEnabled: true
    observability:
      serviceName: "ingest"
      logLevel: "info"
      # otlpEnabled / otlpEndpoint omitted — fall through to global.observability.*
      # via Helm `default` semantics. Override per-environment in the values-*.yaml.

# Janitor service configuration
janitor:
  enabled: true
  replicaCount: 1

  image:
    repository: janitor

  resources:
    requests:
      memory: "512Mi"
      cpu: "1500m"
    limits:
      memory: "12Gi"
      cpu: "4000m"

  cache:
    size: "20Gi"

  config:
    metaEndpoint: "http://meta:9500"
    queryEndpoint: "http://query:9510"
    # Merge settings
    mergerIntervalSeconds: 300
    observability:
      serviceName: "janitor"
      logLevel: "info"
      otlpEnabled: false
      otlpEndpoint: ""

# UI configuration
ui:
  enabled: true
  replicaCount: 1

  image:
    repository: ui

  service:
    type: ClusterIP
    port: 80
    targetPort: 3000

  # Disabled by default. Enable to expose the UI via a Kubernetes
  # Ingress controller. Pair with cert-manager annotations for TLS.
  # Full schema in charts/ui/values.yaml.
  ingress:
    enabled: false

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  config:
    queryEndpoint: "http://query:9510"
    metaEndpoint: "http://meta:9500"

# Nursery service configuration
nursery:
  enabled: true
  replicaCount: 1

  image:
    repository: nursery

  service:
    type: ClusterIP
    port: 3002

  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

  # Working directory size limit for baby segments
  workingDir:
    sizeLimit: "50Gi"

  config:
    metaEndpoint: "http://meta:9500"
    # Polling interval for meta service in seconds
    metaPollIntervalSecs: 5
    # Stream inactivity timeout in seconds
    streamTimeoutSecs: 300
