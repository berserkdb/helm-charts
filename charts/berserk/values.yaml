# Global configuration applied to all subcharts
global:
  # Image registry for all Berserk images
  imageRegistry: ghcr.io/berserkdb
  # Image pull policy
  imagePullPolicy: Always
  # Override image tag for all services (defaults to Chart appVersion)
  imageTag: ""
  # Image pull secrets (for private registry mirrors, air-gapped environments, etc.)
  imagePullSecrets: []
  # ServiceAccount name for pod specs (e.g. for IRSA on EKS)
  serviceAccountName: ""
  # Labels applied to all resources
  labels: {}
  # Name of this Berserk cluster (a Helm install / logical tenant). Stamped on
  # every telemetry record as `bzrk.cluster.name` so alerts and dashboards can
  # scope queries to one install when multiple installs share a k8s cluster
  # or share a Grafana backend. When empty, defaults to "default".
  # Override in per-env values files: "dev", "valhalla", etc.
  clusterName: ""
  # Public-facing base URL of this install — the gateway's externally
  # reachable URL (scheme + host [+ port], no trailing path). `gateway`
  # mints OIDC redirect URIs from it and `ui` builds absolute links against
  # it; both inherit this value unless they set their own
  # `config.publicBaseUrl`. The default targets a local gateway (port
  # 9500) so `helm install` renders out of the box — override it with
  # your real URL for any networked deployment.
  publicBaseUrl: "http://localhost:9500"
  # S3 storage configuration
  storage:
    endpoint: ""
    bucket: ""
    region: ""
    # Object-key prefix within the bucket (empty = bucket root). Lets multiple
    # installs share one bucket with isolated prefixes (e.g. "holion", "ethira").
    path: ""
  # S3 credentials secret configuration
  s3Credentials:
    # Set managed: true and provide accessKeyId/secretAccessKey to have the chart manage the secret
    managed: false
    secretName: "s3-credentials"
    accessKeyId: ""
    secretAccessKey: ""
    accessKeyIdKey: "AWS_ACCESS_KEY_ID"
    secretAccessKeyKey: "AWS_SECRET_ACCESS_KEY"
  # PostgreSQL credentials secret configuration
  postgresCredentials:
    # Set managed: true and provide databaseUrl to have the chart manage the secret
    managed: false
    secretName: "postgres-credentials"
    databaseUrl: ""
    databaseUrlKey: "database_url"
  # PostgreSQL credentials for the auth-side stack (gateway / permissions).
  # By default they share the meta database and isolate
  # themselves via the `auth` schema (see `authDatabaseSchema` below);
  # sqlx puts `_sqlx_migrations` in the first writable schema on the
  # connection's search_path, so `auth._sqlx_migrations` and
  # `public._sqlx_migrations` coexist without collision. Operators
  # who prefer a separate logical database (the dev cluster does)
  # override this secret to point at it and set `authDatabaseSchema`
  # to the empty string.
  authPostgresCredentials:
    managed: false
    secretName: "postgres-credentials"
    databaseUrl: ""
    databaseUrlKey: "database_url"
  # Postgres schema for the auth-side tables. `"auth"` is the
  # default — gateway creates the schema on first boot and pins
  # every pool connection's `search_path` to it; admin_ui and
  # permissions honour the same schema on every connection. Set to
  # the empty string to opt out (e.g. dev cluster, which keeps the
  # historical two-DB layout with auth tables in `public`).
  authDatabaseSchema: "auth"
  # Ingest token configuration.
  # `managed: true` (default) makes the ingest service's init container create
  # the default table and a default ingest token on first install, storing the
  # plaintext token in the `ingestToken.secretName` Secret. The quickstart in
  # NOTES.txt assumes this mode.
  #
  # Set `managed: false` for production deployments that integrate with an
  # external secret store (Vault, External Secrets Operator, SealedSecrets,
  # etc.); in that case you must provision `ingestToken.secretName` yourself
  # and use the `bzrk ingest-token create` CLI flow shown in NOTES.txt to
  # mint tokens.
  ingestToken:
    managed: true
    secretName: "ingest-token"
    key: "default_ingest_token"
    tokenName: "default_ingest_token"
  # Observability configuration (OTLP telemetry)
  observability:
    otlpEnabled: false
    otlpEndpoint: "ingest:4317"
  # Default database that the init-ingest-token container routes its
  # table + token into. Mirrors `defaultTable` — both default to the
  # `default` database/table that meta's migration 026 seeds.
  defaultDatabase: "default"
  # Default table name for Berserk
  defaultTable: "default"
  # NetworkPolicy configuration
  # Requires a CNI plugin that supports NetworkPolicy (Calico, Cilium, or
  # EKS VPC CNI v1.14+ with ENABLE_NETWORK_POLICY).
  networkPolicy:
    enabled: false
    # Additional ingress rules applied to ALL services
    additionalIngress: []
    # External egress destinations (S3, PostgreSQL, etc.)
    # Each entry: {cidr: "0.0.0.0/0", ports: [{port: 443, protocol: TCP}]}
    # Default allows HTTPS to anywhere -- tighten to your S3/DB CIDRs in production.
    externalEgress:
      - cidr: 0.0.0.0/0
        ports:
          - port: 443
            protocol: TCP
      - cidr: 0.0.0.0/0
        ports:
          - port: 5432
            protocol: TCP
    # OTLP egress rules used when global.observability.otlpEndpoint points
    # outside this Helm release's namespace. Each entry must specify either
    # `cidr` (external ipBlock) OR `namespace` + `podLabels` (cross-namespace
    # in-cluster peer). When using the default (ingest:4317), egress is
    # handled automatically and otlpEgress is ignored.
    otlpEgress: []
    # External collector via ipBlock:
    #  - cidr: 10.0.0.0/8
    #    ports:
    #      - port: 4317
    #        protocol: TCP
    # Cross-namespace in-cluster collector via namespace + pod selector:
    #  - namespace: observability
    #    podLabels:
    #      app: otel-collector
    #    ports:
    #      - port: 4317
    #        protocol: TCP
  # Node scheduling constraints (applied to all services unless overridden)
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Post-install setup job configuration
setup:
  # The init-ingest-token init container now ensures the table exists before
  # creating the token, so this job is only needed for installs without managed
  # ingest tokens.
  enabled: false
  image:
    repository: cli
    # tag: overrides global.imageTag

# Meta service configuration
meta:
  enabled: true
  replicaCount: 1

  image:
    repository: meta
    # tag: overrides global.imageTag

  service:
    type: ClusterIP
    port: 9560

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"

  config:
    # Storage configuration
    storageEndpoint: ""
    storageBucket: ""
    storageRegion: ""
    # Observability settings
    observability:
      serviceName: "meta"
      logLevel: "info"
      otlpEnabled: false
      otlpEndpoint: ""

# Query service configuration
query:
  enabled: true
  replicaCount: 1

  image:
    repository: query

  service:
    type: ClusterIP
    port: 9510

  # Segment cache configuration
  cache:
    enabled: true
    size: "128Gi"
    sizeLimit: "128GiB"

  resources:
    requests:
      memory: "1Gi"
      cpu: "2000m"
    limits:
      memory: "4Gi"
      cpu: "4000m"

  config:
    metaEndpoint: "http://meta:9560"
    observability:
      serviceName: "query"
      logLevel: "info"
      otlpEnabled: false
      otlpEndpoint: ""

# Ingest service configuration
ingest:
  enabled: true
  replicaCount: 1

  image:
    repository: ingest

  service:
    type: ClusterIP
    ports:
      otlpGrpc: 4317
      otlpHttp: 4318
      loki: 3100
      health: 9550

  # Disabled by default. Enable to expose ingest via a Kubernetes
  # Ingress controller. For OTLP gRPC on 4317, set the appropriate
  # backend-protocol annotation (nginx: "GRPC", traefik: "h2c"). A single
  # Ingress can fan out to gRPC and HTTP using per-path `portName`.
  # Full schema in charts/ingest/values.yaml.
  ingress:
    enabled: false

  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "4000m"

  config:
    metaEndpoint: "http://meta:9560"
    batch:
      maxBatchBytes: 16777216
      maxBatchAgeSecs: 2
      keepAliveIntervalSecs: 120
    requireAuth: false
    laxUtf8: true
    lokiEnabled: true
    observability:
      serviceName: "ingest"
      logLevel: "info"
      # otlpEnabled / otlpEndpoint omitted — fall through to global.observability.*
      # via Helm `default` semantics. Override per-environment in the values-*.yaml.

# Janitor service configuration
janitor:
  enabled: true
  replicaCount: 1

  image:
    repository: janitor

  resources:
    requests:
      memory: "512Mi"
      cpu: "1500m"
    limits:
      # One merge per pod (sequential). `WriterBudget::Auto` is 100% of this
      # limit, so writers/pass = limit / WRITER_MEMORY_ESTIMATE (4 MiB) ≈ 1024 at
      # 4Gi — raising the limit means more writers/fewer passes, lowering it adds
      # passes. The merge heap is small (~few hundred MiB writer pool + ≤64 MiB
      # hash tracker + ~0.5 GiB vsearch index + ~0.5 GiB baseline); the multi-GiB
      # OOMs were MIMX alias accumulation, fixed by deduping (mimx_collector).
      # File-backed page cache (mmap inputs + temp writes) is reclaimable and not
      # counted against OOM. 4Gi gives ample headroom; requests stay 512Mi
      # (burstable). NB: keep ≥ ~2x the writer pool — a tighter 2Gi previously
      # OOMed.
      memory: "4Gi"
      cpu: "4000m"

  cache:
    # Merge scratch lives on this pod-internal emptyDir (mounted at
    # /tmp/segment-cache, see `config.cacheDir`). Sequential per pod; a merge's
    # peak on-disk footprint is compressed inputs + temp files + output ≈ 3× the
    # meta planner's `max_segment_size` (total-compressed-input cap, default 5GB).
    #
    # SIZING RULE (rule of thumb): cache.size >= ~6 × meta max_segment_size. At
    # the 5GB default that is this 30Gi. If you raise meta's max_segment_size,
    # raise this proportionally or large merges evict mid-transfer. HARD cap —
    # the pod is evicted if exceeded mid-merge.
    #
    # 30Gi also keeps the per-node total modest: janitors share node disk with
    # the query segment-cache PVC, and on the tightest node 4 × 30Gi fits well
    # inside free space. (Orphans from SIGKILLed merges are reclaimed at startup,
    # see janitor `reclaim_scratch`, so this need only cover one live merge.)
    size: "30Gi"

  config:
    metaEndpoint: "http://meta:9560"
    queryEndpoint: "http://query:9510"
    # Janitor merge scratch dir. Point this at the pod-internal `cache`
    # volume above (/tmp/segment-cache), NEVER the container's system-wide
    # /tmp — janitor scratch is many GiB and /tmp is often a small tmpfs.
    cacheDir: "/tmp/segment-cache"
    # Merge poll cadence. A merger cycle drains the queue — it merges tasks
    # back-to-back while any exist — so this is only the idle re-poll interval
    # between empty polls. Kept short so a freshly-created task is picked up
    # promptly; a backlog clears at merge-speed regardless of this value.
    mergerIntervalSeconds: 10
    observability:
      serviceName: "janitor"
      logLevel: "info"
      otlpEnabled: false
      otlpEndpoint: ""

# UI configuration
ui:
  enabled: true
  replicaCount: 1

  image:
    repository: ui

  service:
    type: ClusterIP
    port: 80
    # The UI listens on 9570 and serves /health there. This umbrella value
    # overrides the subchart default, so it must stay 9570 — the health probes
    # target this port.
    targetPort: 9570

  # Disabled by default. Enable to expose the UI via a Kubernetes
  # Ingress controller. Pair with cert-manager annotations for TLS.
  # Full schema in charts/ui/values.yaml.
  ingress:
    enabled: false

  # Sized for the UI runtime (~650 MB resident at startup); see subchart values.
  resources:
    requests:
      memory: "512Mi"
      cpu: "100m"
    limits:
      memory: "768Mi"
      cpu: "500m"

  config:
    # gRPC backends (scheme stripped in the deployment template).
    queryEndpoint: "http://query:9510"
    metaEndpoint: "http://meta:9560"
    # PHX_HOST is derived from global.publicBaseUrl when phxHost is empty.
    publicBaseUrl: ""
    permissions:
      baseUrl: "http://permissions:9580"

# Gateway service configuration (authenticating reverse proxy /
# public edge for the auth + ui stack).
gateway:
  # Disabled by default — operators opt in once they're ready to run
  # the OIDC/CLI-auth flow. Old `ui` keeps working in parallel.
  enabled: true
  replicaCount: 1

  image:
    repository: gateway

  service:
    type: ClusterIP
    port: 9500

  ingress:
    enabled: false

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  config:
    # Public-facing URL of this gateway. Inherits `global.publicBaseUrl`
    # when empty (set that once for the whole install).
    publicBaseUrl: ""
    # `upstreamBaseUrl` (the single merged-ui upstream, data-plane + admin)
    # is inherited from the gateway subchart default (`http://ui`). The
    # umbrella chart's Service layout makes it always work; no override
    # needed in normal installs.
    permissions:
      baseUrl: "http://permissions:9580"
    deploymentMode: "self_hosted"
    cookieSecure: true
    observability:
      serviceName: "gateway"
      logLevel: "info,gateway=debug"

# Permissions service (authorization tuples + /v1/check). Shared by
# gateway and ui.
permissions:
  enabled: true
  replicaCount: 1

  image:
    repository: permissions

  service:
    type: ClusterIP
    port: 9580

  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "500m"

  config:
    observability:
      serviceName: "permissions"
      logLevel: "info,permissions=debug"

# Nursery service configuration
nursery:
  enabled: true
  replicaCount: 1

  image:
    repository: nursery

  service:
    type: ClusterIP
    port: 3002

  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "4Gi"
      cpu: "4000m"

  # Working directory size limit for baby segments
  workingDir:
    sizeLimit: "50Gi"

  config:
    metaEndpoint: "http://meta:9560"
    # Polling interval for meta service in seconds
    metaPollIntervalSecs: 5
    # Stream inactivity timeout in seconds
    streamTimeoutSecs: 300
