# Global configuration applied to all subcharts
global:
  # Image registry for all Berserk images
  imageRegistry: ghcr.io/berserkdb
  # Image pull policy
  imagePullPolicy: Always
  # Override image tag for all services (defaults to Chart appVersion)
  imageTag: ""
  # Image pull secrets
  imagePullSecrets:
    - name: ghcr-credentials
  # ServiceAccount name for pod specs (e.g. for IRSA on EKS)
  serviceAccountName: ""
  # Labels applied to all resources
  labels: {}
  # S3 storage configuration
  storage:
    endpoint: ""
    bucket: ""
    region: ""
  # S3 credentials secret configuration
  s3Credentials:
    # Set managed: true and provide accessKeyId/secretAccessKey to have the chart manage the secret
    managed: false
    secretName: "s3-credentials"
    accessKeyId: ""
    secretAccessKey: ""
    accessKeyIdKey: "AWS_ACCESS_KEY_ID"
    secretAccessKeyKey: "AWS_SECRET_ACCESS_KEY"
  # PostgreSQL credentials secret configuration
  postgresCredentials:
    # Set managed: true and provide databaseUrl to have the chart manage the secret
    managed: false
    secretName: "postgres-credentials"
    databaseUrl: ""
    databaseUrlKey: "database_url"
  # Image registry credentials (e.g. GHCR)
  # Set managed: true and provide password (GHCR token) to have the chart manage the pull secret
  imageCredentials:
    managed: false
    registry: "ghcr.io"
    secretName: "ghcr-credentials"
    password: ""
  # Ingest token configuration
  # Set managed: true to auto-create the token via an init container on the ingest service
  ingestToken:
    managed: false
    secretName: "ingest-token"
    key: "default_ingest_token"
    tokenName: "default_ingest_token"
  # Observability configuration (OTLP telemetry)
  observability:
    otlpEnabled: false
    otlpEndpoint: "ingest:4317"
  # Default dataset name for Berserk
  defaultDataset: "default"
  # Node scheduling constraints (applied to all services unless overridden)
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Post-install setup job configuration
setup:
  # The init-ingest-token init container now ensures the dataset exists before
  # creating the token, so this job is only needed for installs without managed
  # ingest tokens.
  enabled: false
  image:
    repository: cli
    # tag: overrides global.imageTag

# Meta service configuration
meta:
  enabled: true
  replicaCount: 1

  image:
    repository: meta
    # tag: overrides global.imageTag

  service:
    type: ClusterIP
    port: 9500

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"

  config:
    # Storage configuration
    storageEndpoint: ""
    storageBucket: ""
    storageRegion: ""
    # Observability settings
    observability:
      serviceName: "meta"
      logLevel: "info"
      otlpEnabled: false
      otlpEndpoint: ""

# Query service configuration
query:
  enabled: true
  replicaCount: 1

  image:
    repository: query

  service:
    type: ClusterIP
    port: 9510

  # Segment cache configuration
  cache:
    enabled: true
    size: "128Gi"
    sizeLimit: "128GiB"

  resources:
    requests:
      memory: "1Gi"
      cpu: "2000m"
    limits:
      memory: "4Gi"
      cpu: "4000m"

  config:
    metaEndpoint: "http://meta:9500"
    observability:
      serviceName: "query"
      logLevel: "info"
      otlpEnabled: false
      otlpEndpoint: ""

# Ingest (Tjalfe) configuration
ingest:
  enabled: true
  replicaCount: 1

  image:
    repository: ingest

  service:
    type: ClusterIP
    ports:
      otlpGrpc: 4317
      otlpHttp: 4318
      telemetry: 8888

  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "4000m"

  config:
    observability:
      serviceName: "ingest"
      logLevel: "info"
      otlpEnabled: false
      otlpEndpoint: ""

# Janitor service configuration
janitor:
  enabled: true
  replicaCount: 1

  image:
    repository: janitor

  resources:
    requests:
      memory: "512Mi"
      cpu: "1500m"
    limits:
      memory: "8Gi"
      cpu: "4000m"

  cache:
    size: "20Gi"

  config:
    metaEndpoint: "http://meta:9500"
    queryEndpoint: "http://query:9510"
    # Merge settings
    mergerIntervalSeconds: 300
    observability:
      serviceName: "janitor"
      logLevel: "info"
      otlpEnabled: false
      otlpEndpoint: ""

# UI configuration
ui:
  enabled: true
  replicaCount: 1

  image:
    repository: ui

  service:
    type: ClusterIP
    port: 80
    targetPort: 3000

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  config:
    queryEndpoint: "http://query:9510"

# Nursery service configuration
nursery:
  enabled: true
  replicaCount: 1

  image:
    repository: nursery

  service:
    type: ClusterIP
    port: 3002

  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

  # Working directory size limit for baby segments
  workingDir:
    sizeLimit: "50Gi"

  config:
    metaEndpoint: "http://meta:9500"
    # Polling interval for meta service in seconds
    metaPollIntervalSecs: 5
    # Stream inactivity timeout in seconds
    streamTimeoutSecs: 300
