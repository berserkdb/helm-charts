# Default values for the source MCP service (read-only git access
# for agents; serves MCP Streamable HTTP at /mcp).
replicaCount: 1
component: source

image:
  repository: source
  pullPolicy: Always
  tag: ""

service:
  type: ClusterIP
  port: 9585
  externalIPs: []

# NetworkPolicy: apps/ui's server-side agent is the only consumer.
# allowExternalEgress stays on — clones reach external git hosts over
# HTTPS and the allow-list lives in the auth Postgres.
networkPolicy:
  allowExternal: false
  allowExternalEgress: true

  ingressFrom:
    - app: ui
      ports: [{port: 9585}]
  egressTo: []
  additionalIngress: []
  additionalEgress: []

nodeSelector: {}
tolerations: []
affinity: {}

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "2Gi"
    cpu: "1000m"

# RUST_LOG filter for the source binary.
logLevel: "info"

# Clone cache disk. persistent: true → StatefulSet + PVC (same storage
# class as the query segment cache unless overridden); false →
# Deployment + emptyDir. Either way the cache is disposable: the
# sweeper evicts idle / over-budget clones and reads re-clone lazily.
cache:
  persistent: false
  # PVC request (persistent) or emptyDir sizeLimit. Keep headroom
  # above diskCapBytes — eviction runs after the budget is exceeded.
  size: "20Gi"
  storageClass: ""
  # Sweeper eviction budget in bytes (SOURCE_DISK_CAP_BYTES).
  diskCapBytes: "10737418240" # 10 GiB
  idleTtlSecs: 3600
  cloneDepth: 50
