apiVersion: apps/v1
{{- if .Values.cache.persistent }}
kind: StatefulSet
{{- else }}
kind: Deployment
{{- end }}
metadata:
  name: {{ include "berserk-common.fullname" . }}
  labels:
    {{- include "berserk-common.labels" . | nindent 4 }}
    component: {{ .Values.component | default "backend" }}
spec:
  {{- if .Values.cache.persistent }}
  serviceName: {{ include "berserk-common.fullname" . }}
  {{- end }}
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit | default 2 }}
  selector:
    matchLabels:
      {{- include "berserk-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "berserk-common.selectorLabels" . | nindent 8 }}
        component: {{ .Values.component | default "backend" }}
    spec:
      # Keep k8s from injecting SOURCE_* service-link env vars into the
      # pod (hygiene; matches the other subcharts).
      enableServiceLinks: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
{{- include "berserk-common.scheduling" . }}
{{- include "berserk-common.serviceAccountName" . }}
      containers:
        - name: source
          image: {{ include "berserk-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default .Values.global.imagePullPolicy | default "Always" }}
          securityContext:
            allowPrivilegeEscalation: false
          args: ["serve"]
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
              protocol: TCP
          env:
            - name: SOURCE_BIND
              value: "0.0.0.0:{{ .Values.service.port }}"
            - name: SOURCE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.authPostgresCredentials.secretName }}
                  key: {{ .Values.global.authPostgresCredentials.databaseUrlKey }}
            # Render unconditionally so an explicit empty value
            # (the dev cluster's opt-out signal) flows through;
            # `with` would skip the block on empty.
            - name: SOURCE_DATABASE_SCHEMA
              value: {{ .Values.global.authDatabaseSchema | quote }}
            - name: SOURCE_CLONE_ROOT
              value: "/clone_cache"
            - name: SOURCE_DISK_CAP_BYTES
              value: {{ .Values.cache.diskCapBytes | quote }}
            - name: SOURCE_IDLE_TTL_SECS
              value: {{ .Values.cache.idleTtlSecs | quote }}
            - name: SOURCE_CLONE_DEPTH
              value: {{ .Values.cache.cloneDepth | quote }}
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
            - name: RUST_BACKTRACE
              value: "1"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: clone-cache
              mountPath: /clone_cache
      {{- if not .Values.cache.persistent }}
      volumes:
        - name: clone-cache
          emptyDir:
            sizeLimit: {{ .Values.cache.size }}
      {{- end }}
  {{- if .Values.cache.persistent }}
  volumeClaimTemplates:
    - metadata:
        name: clone-cache
      spec:
        accessModes: [ "ReadWriteOnce" ]
        {{- with .Values.cache.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.cache.size }}
  {{- end }}
