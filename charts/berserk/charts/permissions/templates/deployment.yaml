{{- include "berserk-common.deployment.header" . }}
{{- include "berserk-common.serviceAccountName" . }}
      containers:
        - name: permissions
          image: {{ include "berserk-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default .Values.global.imagePullPolicy | default "Always" }}
          securityContext:
            allowPrivilegeEscalation: false
          args:
            - "-c"
            - "/config/config.yaml"
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
              protocol: TCP
          env:
            # Registration needs an address other pods can dial, and the bind is
            # a wildcard.
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: PERMISSIONS_BIND
              value: "0.0.0.0:{{ .Values.service.port }}"
            - name: PERMISSIONS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.authPostgresCredentials.secretName }}
                  key: {{ .Values.global.authPostgresCredentials.databaseUrlKey }}
            # Render unconditionally so an explicit empty value
            # (the dev cluster's opt-out signal) flows through;
            # `with` would skip the block on empty.
            - name: PERMISSIONS_DATABASE_SCHEMA
              value: {{ .Values.global.authDatabaseSchema | quote }}
            - name: PERMISSIONS_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.secretName }}
                  key: {{ .Values.secrets.serviceTokenKey }}
            - name: RUST_BACKTRACE
              value: "1"
            {{- include "berserk-common.env.cluster-name" . | nindent 12 }}
            {{- if .Values.config.metaEndpoint }}
            {{- include "berserk-common.env.node-id" . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /health/started
              port: http
            failureThreshold: 30
            periodSeconds: 3
          volumeMounts:
            {{- include "berserk-common.volumeMount.config" . | nindent 12 }}
            {{- if .Values.config.metaEndpoint }}
            {{- include "berserk-common.volumeMount.node-id" . | nindent 12 }}
            {{- end }}
      volumes:
        {{- include "berserk-common.volume.config" . | nindent 8 }}
        {{- if .Values.config.metaEndpoint }}
        {{- include "berserk-common.volume.node-id" . | nindent 8 }}
        {{- end }}
