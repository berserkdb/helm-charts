# Default values for permissions service
replicaCount: 1
component: permissions

image:
  repository: permissions
  tag: ""

service:
  type: ClusterIP
  port: 9580
  externalIPs: []

# NetworkPolicy: only gateway + ui should reach permissions in
# normal operation. allowExternal is off — there's no reason to
# expose this externally.
networkPolicy:
  allowExternal: false
  allowExternalEgress: true

  ingressFrom:
    - app: gateway
      ports: [{port: 9580}]
    - app: ui
      ports: [{port: 9580}]
  egressTo:
    # Fleet registration only (config.metaEndpoint) — no authorization decision
    # leaves this pod. Drop the rule if you clear that.
    - app: meta
      ports: [{ port: 9560 }]
  additionalIngress: []
  additionalEgress: []

resources:
  requests:
    memory: "64Mi"
    cpu: "200m"
  limits:
    memory: "256Mi"

config:

  # dbPool: {}  # pool sizing and timeouts; fields and defaults in libs/bzrk_db
  # Meta, for fleet registration only: permissions publishes its pod IP and port
  # there so the in-product collector can scrape it without asking the Kubernetes
  # API. No authorization decision touches meta — clear it and permissions simply
  # stops appearing in the fleet, which also removes it from the collector's
  # default (`meta`) discovery, so add `permissions:9580` to
  # `ui.collector.staticTargets` if you do.
  metaEndpoint: "http://meta:9560"
  observability:
    serviceName: "permissions"
    logLevel: "info,permissions=debug"
    # otlpEnabled / otlpEndpoint fall through to global.observability.*
