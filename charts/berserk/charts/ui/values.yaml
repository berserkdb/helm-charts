# Default values for ui service
replicaCount: 1
component: frontend

image:
  repository: ui
  pullPolicy: Always
  tag: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 3000
  # externalIPs: optional list of node-bound VIPs (see _service.tpl docs).
  # Almost never used for the UI; prefer ingress below or LoadBalancer.
  externalIPs: []

# Ingress (optional). Disabled by default. Standard HTTP Ingress for the
# Berserk web UI. Pair `tls` with cert-manager for automatic certs:
#   annotations:
#     cert-manager.io/cluster-issuer: letsencrypt-prod
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  # - host: ui.example.com
  #   paths:
  #     - path: /
  #       pathType: Prefix
  tls: []
  # - hosts: [ui.example.com]
  #   secretName: ui-tls

# NetworkPolicy: ui sits behind gateway after Stage-4. Only the
# gateway pod should reach it on port 3000; external ingress flows
# through the gateway's public surface, not directly into ui.
# Egress goes to query/meta as before.
networkPolicy:
  allowExternal: false
  allowExternalEgress: true

  ingressFrom:
    - app: gateway
      ports: [{port: 3000}]
  egressTo:
    - app: query
      ports: [{port: 9510}]
    - app: meta
      ports: [{port: 9560}]
  additionalIngress: []
  additionalEgress: []

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

config:
  queryEndpoint: "http://query:9510"
  metaEndpoint: "http://meta:9560"
  observability:
    serviceName: "ui"
    logLevel: "info"
    # otlpEnabled: false
    # otlpEndpoint: ""

library:
  # Leave gitRepo empty to disable git sync (file-only mode).
  gitRepo: ""
  gitBranch: "main"
  syncIntervalSecs: 60

  # SSH credentials for the git remote.
  # Both modes reference the same `secretName`; it must contain keys:
  #   id_ed25519 (private key), known_hosts (ssh-keyscan output).
  # managed: true  -> chart creates the Secret. Supply privateKey + knownHosts
  #                   via --set-file on first install; the template uses
  #                   lookup() to preserve the existing data on subsequent
  #                   upgrades, so you do not have to pass them every time.
  # managed: false -> reference an existing Secret (create it out-of-band).
  ssh:
    managed: false
    secretName: "ui-library-git-ssh"
    privateKey: ""
    knownHosts: ""

  # Storage: "emptyDir" (ephemeral, fine with git sync) or "pvc" (persistent).
  # NOTE: "pvc" uses ReadWriteOnce — only works with replicaCount: 1.
  storage: "emptyDir"
  storageSize: "1Gi"
  storageClass: ""

# Service tokens. Gateway sits in front of `ui` post Stage-4 and
# injects `X-Bzrk-*` identity headers; `ui` verifies the proxy hop
# via the pre-shared service token. Default-points at the same
# `gateway-secrets` Secret that the gateway subchart provisions —
# install with the umbrella chart and both halves agree out of the
# box. Override `secrets.secretName` when running `ui` against a
# pre-existing token.
secrets:
  secretName: "gateway-secrets"
  gatewayServiceTokenKey: "service_token"
