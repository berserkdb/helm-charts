# Default values for ui service
replicaCount: 1
component: frontend

image:
  repository: ui
  pullPolicy: Always
  tag: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

config:
  queryEndpoint: "http://query:9510"
  metaEndpoint: "http://meta:9500"
  observability:
    serviceName: "ui"
    logLevel: "info"
    # otlpEnabled: false
    # otlpEndpoint: ""

library:
  # Git sync settings (omit gitRepo to use file-only mode)
  gitRepo: ""
  gitToken: ""
  gitBranch: "main"
  # Storage: "emptyDir" (ephemeral, fine with git sync) or "pvc" (persistent).
  # NOTE: "pvc" uses ReadWriteOnce — only works with replicaCount: 1.
  storage: "emptyDir"
  storageSize: "1Gi"
  storageClass: ""

# Cookie secret for session signing (auto-generated if not set)
cookieSecret:
  value: ""
