# Default values for ui service
replicaCount: 1
component: frontend

# Database migrations. When enabled (default), a pre-install/pre-upgrade hook
# Job runs the Ecto migrations to completion before the app rolls out — the
# safe path for multi-replica installs. Disable only if migrations are applied
# out of band; the image entrypoint still migrates idempotently on boot.
migrations:
  enabled: true

image:
  repository: ui
  pullPolicy: Always
  tag: ""

service:
  type: ClusterIP
  port: 80
  # Port the UI container listens on. Feeds the container port, the health
  # probes, and the app's bind address — they must all agree.
  targetPort: 9570
  # externalIPs: optional list of node-bound VIPs (see _service.tpl docs).
  # Almost never used for the UI; prefer ingress below or LoadBalancer.
  externalIPs: []

# Ingress (optional). Disabled by default. Standard HTTP Ingress for the
# Berserk web UI. Pair `tls` with cert-manager for automatic certs:
#   annotations:
#     cert-manager.io/cluster-issuer: letsencrypt-prod
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  # - host: ui.example.com
  #   paths:
  #     - path: /
  #       pathType: Prefix
  tls: []
  # - hosts: [ui.example.com]
  #   secretName: ui-tls

# NetworkPolicy: ui sits behind gateway after Stage-4. Only the
# gateway pod should reach it on port 9570; external ingress flows
# through the gateway's public surface, not directly into ui.
# Egress goes to query/meta as before.
networkPolicy:
  allowExternal: false
  allowExternalEgress: true

  ingressFrom:
    - app: gateway
      ports: [{port: 9570}]
  egressTo:
    - app: gateway
      ports: [{port: 9500}]
    - app: query
      ports: [{port: 9510}]
    - app: meta
      ports: [{port: 9560}]
    - app: permissions
      ports: [{port: 9580}]
  additionalIngress: []
  additionalEgress: []
  # The in-product operator-metrics collector (#4122) scrapes every annotated
  # Berserk pod's operator /metrics and lists pods from the Kubernetes API. Both are
  # generic rules driven by global.networkPolicy.scrape / .kubeApiEgress —
  # deliberately not a per-peer port list here, so adding a service or moving an
  # operator port needs no edit on this side. Turn both off together with
  # collector.enabled.
  #
  # Verification after a rollout is `bzrk_collector_targets_stale` and
  # `bzrk_collector_scrapes_failed_total` on this pod's own /metrics: a policy that
  # is too tight shows up there rather than as a crash.
  scrapeEgress: true
  kubeApiEgress: true

# The UI runtime needs ~650 MB resident. The operator-metrics collector (#4122) adds
# ~12-20 MB of steady-state ring buffers plus per-cycle parse transients across every
# scraped pod, which does not fit comfortably in the ~100 MB of headroom a 768Mi limit
# leaves — so the limit is 1Gi. (CI, kind and internal clusters have run the Phoenix ui
# at 1Gi since it landed, so it is the better-exercised value.) Watch
# `bzrk_collector_ets_memory_bytes` and `bzrk_collector_series` before raising
# collector.windowSeconds or widening its allowlist.
resources:
  requests:
    memory: "512Mi"
    cpu: "100m"
  limits:
    memory: "1Gi"
    cpu: "500m"

config:
  # Postgres schema for this service's tables in the shared workspace database
  # (search_path isolation). Empty string opts out.
  databaseSchema: "webui"
  # gRPC backends. The `http://` form is kept for operator familiarity; the
  # deployment strips the scheme to the bare `host:port` the gRPC client
  # expects (QUERY_GRPC_ENDPOINT / META_GRPC_ENDPOINT).
  queryEndpoint: "http://query:9510"
  metaEndpoint: "http://meta:9560"
  # Public host for URL/link generation and same-origin websocket checks
  # (PHX_HOST). Empty ⇒ derived from config.publicBaseUrl / global.publicBaseUrl
  # (scheme + port stripped to the bare hostname).
  phxHost: ""
  # Inherits global.publicBaseUrl (the gateway URL) when empty; used only to
  # derive phxHost above.
  publicBaseUrl: ""
  # Override Phoenix origin checking (PHX_CHECK_ORIGIN) when the app sits behind
  # a proxy whose forwarded Host differs from phxHost. Empty ⇒ strict same-host.
  checkOrigin: ""
  # Ecto connection pool size (POOL_SIZE).
  poolSize: 10
  # CSP nonce source. Empty ⇒ the app mints its own nonce. Set to a request
  # header name ⇒ the app requires that header on every browser request and
  # uses its value as the CSP nonce (for deployments behind a front proxy that
  # mints the nonce and injects it into both the request and the CSP header).
  cspNonceHeader: ""
  permissions:
    baseUrl: "http://permissions:9580"
  # In-cluster gateway Service URL for the UI's internal calls (the
  # /internal/users Members API, GATEWAY_HTTP_ENDPOINT). Keeps the call inside
  # the cluster rather than hairpinning through the public ingress.
  gatewayInternalBaseUrl: "http://gateway:9500"
  # OpenTelemetry export. When otlpEnabled (here or via global.observability),
  # the deployment injects the standard OTEL_* env so the UI exports traces to
  # the collector at otlpEndpoint (host:port; scheme added by the template).
  # serviceName is the service identity reported in telemetry.
  observability:
    otlpEnabled: false
    otlpEndpoint: ""
    serviceName: "ui"

# Service tokens + signing key.
#
# The gateway sits in front of `ui` and injects `X-Bzrk-*` identity headers;
# `ui` verifies the proxy hop via the pre-shared service token. Those tokens
# default-point at the same `gateway-secrets` Secret the gateway subchart
# provisions — install with the umbrella chart and both halves agree out of the
# box. Override `secrets.secretName` when running `ui` against a pre-existing
# token.
#
# `secret_key_base` signs the UI's session/CSRF cookies (not an auth secret).
# With `managed: true` the chart owns a `<release>-ui-secrets` Secret and
# generates a stable random value, preserved across renders via `lookup`. Set
# `secretKeyBase` to pin a value, or `managed: false` to provision the Secret
# externally (it must carry the `secret_key_base` key).
secrets:
  managed: true
  secretKeyBase: ""
  secretName: "gateway-secrets"
  gatewayServiceTokenKey: "service_token"
  # Token the app presents to apps/permissions /v1/check (same shared secret
  # the gateway uses).
  permissionsServiceTokenKey: "permissions_service_token"

# In-product operator-metrics collector (#4122). Scrapes every pod annotated
# `prometheus.io/scrape: "true"` in this namespace on its operator /metrics port
# every `intervalSeconds`, and keeps a `windowSeconds` rolling window IN MEMORY
# (one ring buffer per series). No time-series database, no PromQL, no retention
# beyond the window, and it is lost on restart.
#
# This is the in-product health view, NOT a replacement for the bundled Prometheus
# (`prometheus.enabled`), which is where durable retention, alerting and
# integration with your own monitoring stack live. Both are wanted; see
# charts/README.md, "Operator metrics: two views".
collector:
  enabled: true
  # Where the scrape target list comes from. Empty means every source at once,
  # which is the default and what almost every install should leave it as.
  #
  #   (empty)     the union: pods from the Kubernetes API, members from the meta
  #               registry, plus `staticTargets`, merged per pod. Neither of the
  #               two real sources is required, so this works with or without
  #               API-server access and needs no per-cluster decision.
  #   kubernetes  pods from the Kubernetes API only. Needs `rbac` and
  #               networkPolicy.kubeApiEgress.
  #   static      `staticTargets` only. For an install that is not on Kubernetes.
  #   meta        registered members over gRPC only. No Kubernetes API access at
  #               all, so it works where the API server's certificate does not
  #               carry `kubernetes.default.svc`, or where policy refuses the
  #               pod-list role.
  #
  # Why the union rather than one of them: the two sources answer different
  # questions. The Kubernetes API is the control plane's record of what *should*
  # exist, so a pod whose reporting has wedged still appears and reads as stale.
  # The registry is each pod's own claim to be alive, so a wedged one is simply
  # absent — which reads as "not deployed" — but it is the only source that knows
  # what version a pod runs, and the only one that works without API access.
  # Taking both keeps stale detection where it is available and still shows a
  # fleet where it is not. The Collector page's "seen by" column says which
  # source each row came from, so the caveat is visible per target rather than
  # per cluster.
  #
  # Pinning a single source is for ruling one out deliberately — a cluster where
  # the API server is known unreachable and the per-cycle warning is just noise,
  # or one where you want the registry ignored entirely.
  #
  # If you do pin `meta`, know that the fleet has to have finished registering. A
  # partially registered registry is non-empty, so on its own it looks exactly
  # like a complete one. Two of the three ways to get there are caught for you: a
  # meta too old to serve this is refused outright, and a meta that has restarted
  # is refused until its registry has been up long enough for every member to
  # have heartbeated, so a restart costs a stale cycle rather than a page showing
  # whichever pods got back first.
  #
  # What is NOT caught is pinning `meta` while part of the fleet still runs a
  # build that does not register at all — that registry is old and internally
  # consistent, just short. Verify against `kubectl get pods` before switching,
  # or list your services in `requiredServices` below and let the check be
  # enforced. Under the default union this matters less: pod discovery still
  # covers what has not registered yet.
  discovery: ""
  # App labels that MUST appear among discovered members when the registry is
  # consulted (`discovery: meta`, or the default union). A missing one makes discovery report an error, so the
  # collector keeps its previously known targets rather than under-reporting.
  # Empty by default: an install that disables a service or scales it to zero
  # would otherwise pin its target list stale forever.
  requiredServices: []
  # - meta
  # - query
  # - ingest
  # - janitor
  #
  # Superseded by `discovery` above, and honoured only while that is empty:
  # true means `kubernetes`, false means `static`.
  podDiscovery: true
  # Let the chart own the ServiceAccount + Role + RoleBinding. Set false to bring
  # your own: pre-create them and point the pod at the account through
  # `global.serviceAccountName`. With discovery unauthorised the app falls back to
  # `staticTargets` — degraded, not broken.
  rbac: true
  # Matches prometheus.scrapeInterval so the two views are comparable.
  intervalSeconds: 30
  # The retained window. Memory is roughly
  # (series x windowSeconds/intervalSeconds x 12 bytes); watch
  # `bzrk_collector_series` and `bzrk_collector_ets_memory_bytes` on this pod's own
  # /metrics before raising either.
  windowSeconds: 3600
  # Fallback targets when discovery is off or unauthorised, as `host:port` or
  # `host:port/path`. These are operator /metrics ports, NOT service ports —
  # query's operator listener is 9511, not 9510.
  #
  # Under `discovery: meta` these are merged in rather than used as a fallback:
  # gateway, permissions and ui do not register with meta, so this is where they
  # come from. Note that a Service address round-robins across its pods, so a
  # counter read through one goes up and down; give per-pod addresses where the
  # per-pod numbers matter.
  staticTargets: []
  # - query:9511
  # - meta:9560
