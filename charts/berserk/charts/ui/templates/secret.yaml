{{- if .Values.secrets.managed }}
{{- $secretName := printf "%s-secrets" (include "berserk-common.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $key := "" }}
{{- if .Values.secrets.secretKeyBase }}
  {{- $key = .Values.secrets.secretKeyBase | b64enc }}
{{- else if and $existing $existing.data (index $existing.data "secret_key_base") }}
  {{- $key = index $existing.data "secret_key_base" }}
{{- else }}
  {{- $key = randAlphaNum 64 | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "berserk-common.labels" . | nindent 4 }}
type: Opaque
data:
  # Signs the UI's session/CSRF cookies. Not an auth secret (auth is the
  # gateway's trusted identity); a stable per-install random value is all it
  # needs. Preserved across renders via `lookup` so it doesn't rotate per deploy.
  secret_key_base: {{ $key }}
{{- end }}
