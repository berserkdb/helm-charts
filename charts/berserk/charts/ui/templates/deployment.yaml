{{- include "berserk-common.deployment.header" . }}
{{- include "berserk-common.serviceAccountName" . }}
      {{- if .Values.library.gitRepo }}
      initContainers:
        # Stage the SSH key from the k8s Secret onto a tmpfs with mode 0400
        # owned by UID 1000. The pod runs as non-root with fsGroup=1000, which
        # would leave the mounted Secret as root:1000 mode 0440 — and SSH's
        # strict check rejects any identity file with group-read bits set.
        - name: git-ssh-perms
          image: {{ include "berserk-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default .Values.global.imagePullPolicy | default "Always" }}
          securityContext:
            allowPrivilegeEscalation: false
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              install -m 0400 /etc/git-ssh-src/id_ed25519  /etc/git-ssh/id_ed25519
              install -m 0444 /etc/git-ssh-src/known_hosts /etc/git-ssh/known_hosts
          volumeMounts:
            - name: git-ssh-src
              mountPath: /etc/git-ssh-src
              readOnly: true
            - name: git-ssh
              mountPath: /etc/git-ssh
      {{- end }}
      containers:
        - name: ui
          image: {{ include "berserk-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default .Values.global.imagePullPolicy | default "Always" }}
          securityContext:
            allowPrivilegeEscalation: false
          args:
            - "-c"
            - "/config/config.yaml"
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              name: http
              protocol: TCP
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: UI_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-cookie-secret" (include "berserk-common.fullname" .) }}
                  key: UI_COOKIE_SECRET
            - name: LEPTOS_OUTPUT_NAME
              value: "ui"
            - name: LEPTOS_SITE_ROOT
              value: "/"
            - name: LEPTOS_SITE_PKG_DIR
              value: "pkg"
            - name: LEPTOS_SITE_ADDR
              value: "0.0.0.0:{{ .Values.service.targetPort }}"
            - name: RUST_BACKTRACE
              value: "1"
            - name: ENVIRONMENT
              value: "demo"
            - name: UI_LIBRARY_DIR
              value: "/library"
            {{- if .Values.library.gitRepo }}
            - name: UI_GIT_REPO
              value: {{ .Values.library.gitRepo | quote }}
            - name: UI_GIT_BRANCH
              value: {{ .Values.library.gitBranch | default "main" | quote }}
            - name: UI_GIT_SYNC_INTERVAL_SECS
              value: {{ .Values.library.syncIntervalSecs | default 60 | quote }}
            - name: GIT_SSH_COMMAND
              value: "ssh -i /etc/git-ssh/id_ed25519 -o UserKnownHostsFile=/etc/git-ssh/known_hosts -o IdentitiesOnly=yes"
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health/started
              port: http
            failureThreshold: 30
            periodSeconds: 3
          volumeMounts:
            {{- include "berserk-common.volumeMount.config" . | nindent 12 }}
            - name: library
              mountPath: /library
            {{- if .Values.library.gitRepo }}
            - name: git-ssh
              mountPath: /etc/git-ssh
              readOnly: true
            {{- end }}
      volumes:
        {{- include "berserk-common.volume.config" . | nindent 8 }}
        {{- if eq (.Values.library.storage | default "emptyDir") "pvc" }}
        - name: library
          persistentVolumeClaim:
            claimName: {{ printf "%s-library" (include "berserk-common.fullname" .) }}
        {{- else }}
        - name: library
          emptyDir: {}
        {{- end }}
        {{- if .Values.library.gitRepo }}
        - name: git-ssh-src
          secret:
            secretName: {{ required "library.ssh.secretName is required when library.gitRepo is set" .Values.library.ssh.secretName | quote }}
            defaultMode: 0400
        # tmpfs staging area written by the init container so the key ends up
        # UID 1000, mode 0400 — the only shape OpenSSH's strict check accepts
        # for a non-root process.
        - name: git-ssh
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        {{- end }}
