{{- include "berserk-common.deployment.header" . }}
{{- /* The shared helper only emits `global.serviceAccountName`, so without this
       override ui would run as the namespace `default` account and the collector's
       pod-list would be refused. Same override ingest makes for its token-init
       Role. */ -}}
{{- if .Values.global.serviceAccountName }}
      serviceAccountName: {{ .Values.global.serviceAccountName }}
{{- else if include "ui.ownServiceAccount" . | trim | eq "true" }}
      serviceAccountName: {{ include "berserk-common.fullname" . }}
{{- end }}
      containers:
        - name: ui
          image: {{ include "berserk-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default .Values.global.imagePullPolicy | default "Always" }}
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              name: http
              protocol: TCP
            # Operator Prometheus /metrics (#3792) on a dedicated internal
            # listener, scraped via the pod's prometheus.io/* annotations. Fixed
            # at the app's BZRK_UI_METRICS_PORT default (9571); keep in sync with
            # the podAnnotations prometheus.io/port.
            - containerPort: 9571
              name: metrics
              protocol: TCP
          env:
            # The image entrypoint migrates the database, then starts the HTTP
            # server bound to 0.0.0.0:$PORT.
            - name: PHX_SERVER
              value: "true"
            - name: PORT
              value: {{ .Values.service.targetPort | quote }}
            # Public host for URL/link generation and same-origin websocket
            # checks. Derived from the gateway's public base URL unless set.
            - name: PHX_HOST
              value: {{ .Values.config.phxHost | default (regexReplaceAll "^https?://([^:/]+).*" (.Values.config.publicBaseUrl | default .Values.global.publicBaseUrl) "${1}") | quote }}
            {{- with .Values.config.checkOrigin }}
            - name: PHX_CHECK_ORIGIN
              value: {{ . | quote }}
            {{- end }}
            # Cookie/CSRF signing key (not authentication — auth is the
            # gateway's trusted identity); the `ui-secrets` Secret self-manages a
            # stable random value.
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: {{ include "berserk-common.fullname" . }}-secrets
                  key: secret_key_base
            # AES-GCM key for workflow connection secrets (Cloak).
            - name: WORKFLOW_CLOAK_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "berserk-common.fullname" . }}-secrets
                  key: workflow_cloak_key
            # Shared workspace database (same one meta uses).
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.postgresCredentials.secretName }}
                  key: {{ .Values.global.postgresCredentials.databaseUrlKey }}
            # Rendered unconditionally so an explicit empty value (opt-out of
            # schema isolation) flows through; `with` would skip on empty.
            - name: UI_PHOENIX_DATABASE_SCHEMA
              value: {{ .Values.config.databaseSchema | quote }}
            - name: POOL_SIZE
              value: {{ .Values.config.poolSize | default 10 | quote }}
            # gRPC backends: bare host:port (no scheme). The values keep the
            # `http://` form operators recognise; the scheme is stripped here.
            - name: QUERY_GRPC_ENDPOINT
              value: {{ regexReplaceAll "^https?://" .Values.config.queryEndpoint "" | quote }}
            - name: META_GRPC_ENDPOINT
              value: {{ regexReplaceAll "^https?://" .Values.config.metaEndpoint "" | quote }}
            # Gateway-side trusted-identity service token. The app constant-time
            # compares this against the `X-Bzrk-Service-Token` header on incoming
            # requests; only gateway should hold the value.
            - name: GATEWAY_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.secretName | quote }}
                  key: {{ .Values.secrets.gatewayServiceTokenKey | quote }}
            # Authorization client — the app calls apps/permissions /v1/check
            # with this service token.
            - name: PERMISSIONS_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.secretName | quote }}
                  key: {{ .Values.secrets.permissionsServiceTokenKey | quote }}
            # Admin HTTP backends (keep scheme). Gateway members API
            # (/internal/users) and permissions (/v1/check).
            - name: GATEWAY_HTTP_ENDPOINT
              value: {{ .Values.config.gatewayInternalBaseUrl | quote }}
            - name: PERMISSIONS_HTTP_ENDPOINT
              value: {{ .Values.config.permissions.baseUrl | quote }}
            # Explore workflow builder + Settings → Integrations. The app
            # only treats 1/true/yes/on as on; any other value stays off.
            - name: WORKFLOWS_UI_ENABLED
              value: {{ .Values.config.workflowsUiEnabled | default false | quote }}
            {{- $ingest := .Values.config.ingest | default dict }}
            {{- if $ingest.host }}
            # The public OTLP endpoint shown on Settings -> Ingest. Stated, not
            # discovered: a sender dials the ingress entrypoint, never a port
            # bound in-cluster.
            - name: BZRK_INGEST_HOST
              value: {{ $ingest.host | quote }}
            {{- with $ingest.grpcPort }}
            - name: BZRK_INGEST_GRPC_PORT
              value: {{ . | quote }}
            {{- end }}
            {{- with $ingest.httpPort }}
            - name: BZRK_INGEST_HTTP_PORT
              value: {{ . | quote }}
            {{- end }}
            - name: BZRK_INGEST_TLS
              value: {{ $ingest.tls | default false | quote }}
            {{- end }}
            {{- if .Values.config.cspNonceHeader }}
            # When set, the app requires this request header (minted and injected
            # by the front proxy) and uses its value as the CSP nonce.
            - name: CSP_NONCE_HEADER
              value: {{ .Values.config.cspNonceHeader | quote }}
            {{- end }}
            {{- $otlp := (.Values.config.observability.otlpEnabled | default .Values.global.observability.otlpEnabled) }}
            {{- $collector := .Values.collector | default dict }}
            {{- if $collector.enabled }}
            # In-product operator-metrics collector (#4122). The default discovery
            # reads meta's fleet registry and merges BZRK_COLLECTOR_STATIC_TARGETS
            # for the services that do not register; with discovery `static`, or
            # when the pod-list is unauthorised, that list is all there is.
            - name: BZRK_COLLECTOR_ENABLED
              value: "true"
            - name: BZRK_COLLECTOR_DISCOVERY
              value: {{ include "ui.collectorDiscovery" . | quote }}
            - name: BZRK_COLLECTOR_INTERVAL_SECONDS
              value: {{ $collector.intervalSeconds | default 30 | quote }}
            - name: BZRK_COLLECTOR_WINDOW_SECONDS
              value: {{ $collector.windowSeconds | default 3600 | quote }}
            {{- with $collector.staticTargets }}
            - name: BZRK_COLLECTOR_STATIC_TARGETS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with $collector.requiredServices }}
            - name: BZRK_COLLECTOR_REQUIRED_SERVICES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if not $otlp }}
            # Discovery needs the namespace, and it comes from the downward API rather
            # than a value so it can never disagree with where the pod actually runs.
            # With OTLP on, the block below already provides these.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- end }}
            {{- else }}
            - name: BZRK_COLLECTOR_ENABLED
              value: "false"
            {{- end }}
            {{- if $otlp }}
            # OpenTelemetry: export traces to the cluster OTLP collector via the
            # standard OTEL_* env vars. OTEL_RESOURCE_ATTRIBUTES (bzrk.cluster.name
            # + k8s.*) comes from the shared helper below.
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.config.observability.serviceName | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ printf "http://%s" (.Values.config.observability.otlpEndpoint | default .Values.global.observability.otlpEndpoint | trimPrefix "https://" | trimPrefix "http://") | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            {{- include "berserk-common.env.cluster-name" . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health/started
              port: http
            failureThreshold: 30
            periodSeconds: 3
