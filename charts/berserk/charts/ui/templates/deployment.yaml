{{- include "berserk-common.deployment.header" . }}
{{- include "berserk-common.serviceAccountName" . }}
      containers:
        - name: ui
          image: {{ include "berserk-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default .Values.global.imagePullPolicy | default "Always" }}
          securityContext:
            allowPrivilegeEscalation: false
          args:
            - "-c"
            - "/config/config.yaml"
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              name: http
              protocol: TCP
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # apps/ui shares the single workspace database (the same one
            # meta uses) and isolates its tables in the `ui` schema.
            - name: UI_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.postgresCredentials.secretName }}
                  key: {{ .Values.global.postgresCredentials.databaseUrlKey }}
            # Rendered unconditionally so an explicit empty value (the
            # opt-out signal) flows through; `with` would skip on empty.
            - name: UI_DATABASE_SCHEMA
              value: {{ .Values.global.uiDatabaseSchema | quote }}
            # The merged app's single pool sets search_path = {app schema},
            # auth, public — the workspace-admin tables live in `auth`,
            # reached by fallthrough. UI_APP_DATABASE_SCHEMA names the app
            # schema (mirrors the dev scenario's run-ui.sh).
            - name: UI_APP_DATABASE_SCHEMA
              value: {{ .Values.global.uiDatabaseSchema | quote }}
            # Gateway-side trusted-identity service token. ui
            # constant-time compares this against the
            # `X-Bzrk-Service-Token` header on incoming requests; only
            # gateway should have the value (defence in depth on top
            # of the NetworkPolicy that already restricts ingress).
            - name: UI_GATEWAY_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.secretName | quote }}
                  key: {{ .Values.secrets.gatewayServiceTokenKey | quote }}
            # Authorization client — the merged app calls apps/permissions
            # /v1/check with this service token (formerly admin-ui).
            - name: UI_PERMISSIONS_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.secretName | quote }}
                  key: {{ .Values.secrets.permissionsServiceTokenKey | quote }}
            {{- if .Values.config.oidc.enabled }}
            # OIDC client_secret mirror — same Secret+key gateway references,
            # so the value stays single-source. Required because the merged
            # app's config validator enforces the >=32-char floor at startup.
            - name: UI_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "ui secrets.oidcClientSecret.existingSecret.name is required when config.oidc.enabled" .Values.secrets.oidcClientSecret.existingSecret.name }}
                  key: {{ required "ui secrets.oidcClientSecret.existingSecret.key is required when config.oidc.enabled" .Values.secrets.oidcClientSecret.existingSecret.key }}
            {{- end }}
            - name: LEPTOS_OUTPUT_NAME
              value: "ui"
            - name: LEPTOS_SITE_ROOT
              value: "/"
            - name: LEPTOS_SITE_PKG_DIR
              value: "pkg"
            - name: LEPTOS_SITE_ADDR
              value: "0.0.0.0:{{ .Values.service.targetPort }}"
            - name: RUST_BACKTRACE
              value: "1"
            - name: ENVIRONMENT
              value: "demo"
            {{- include "berserk-common.env.cluster-name" . | nindent 12 }}
            - name: UI_LIBRARY_DIR
              value: "/library"
            # The library git remote is configured at runtime in the admin UI
            # (stored in ui_config), not via env. HTTPS-only.
            # AI agent's in-process source clone cache. Lives on the library
            # volume (a `.source-clones` subdir of UI_LIBRARY_DIR by default).
            - name: UI_SOURCE_DISK_CAP_BYTES
              value: {{ .Values.source.diskCapBytes | quote }}
            - name: UI_SOURCE_IDLE_TTL_SECS
              value: {{ .Values.source.idleTtlSecs | quote }}
            - name: UI_SOURCE_CLONE_DEPTH
              value: {{ .Values.source.cloneDepth | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health/started
              port: http
            failureThreshold: 30
            periodSeconds: 3
          volumeMounts:
            {{- include "berserk-common.volumeMount.config" . | nindent 12 }}
            - name: library
              mountPath: /library
      volumes:
        {{- include "berserk-common.volume.config" . | nindent 8 }}
        {{- if eq (.Values.library.storage | default "emptyDir") "pvc" }}
        - name: library
          persistentVolumeClaim:
            claimName: {{ printf "%s-library" (include "berserk-common.fullname" .) }}
        {{- else }}
        - name: library
          emptyDir: {}
        {{- end }}
