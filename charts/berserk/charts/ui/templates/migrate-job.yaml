{{- if .Values.migrations.enabled }}
{{- /*
Runs the Ecto migrations to completion BEFORE the app rolls out, as a
pre-install / pre-upgrade Helm hook. The image entrypoint also migrates on boot
(idempotent), which is enough for a single replica; this hook is what makes a
multi-replica rollout safe — migrations finish once, here, so the app pods boot
against an already-current schema instead of racing each other. A migration
failure fails the hook (and the release) cleanly, rather than crash-looping the
app on a half-applied schema.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "berserk-common.fullname" . }}-migrate
  labels:
    {{- include "berserk-common.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  {{- /* A pod that can never start (unpullable image) stays Pending rather than
  failing, so without a deadline the hook neither succeeds nor fails and the
  release waits on it forever — blocking every later revision too. */}}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "berserk-common.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ include "berserk-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default .Values.global.imagePullPolicy | default "Always" }}
          securityContext:
            allowPrivilegeEscalation: false
          command: ["/bin/sh", "-c"]
          args:
            - exec /app/bin/bzrk_explore eval "BzrkExplore.Release.migrate()"
          env:
            # config/runtime.exs requires DATABASE_URL in :prod; the schema pins
            # where migrated tables land — it must match the deployment's
            # UI_PHOENIX_DATABASE_SCHEMA (config.databaseSchema) so the app reads
            # the same schema the migrations write.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.postgresCredentials.secretName }}
                  key: {{ .Values.global.postgresCredentials.databaseUrlKey }}
            - name: UI_PHOENIX_DATABASE_SCHEMA
              value: {{ .Values.config.databaseSchema | quote }}
            # This Job only runs migrate(): no endpoint, no master key. It must
            # stay that way — as a pre-install hook it runs before the Secrets
            # of the main sync phase exist.
            - name: POOL_SIZE
              value: {{ .Values.config.poolSize | default 5 | quote }}
            # Migrations are allowed to take as long as they take. The app's 30s
            # statement timeout would cancel an index build or a backfill part
            # way and fail the deploy, so this hook lifts it — and only this hook.
            - name: DB_STATEMENT_TIMEOUT_MS
              value: "0"
{{- end }}
