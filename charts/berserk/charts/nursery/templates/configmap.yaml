{{- define "nursery.config-data" -}}
data:
  config.yaml: |
    http_bind: "0.0.0.0:{{ .Values.service.port }}"
    meta_endpoint: {{ .Values.config.metaEndpoint | quote }}
    cloud_storage_access_key: ${NURSERY_STORAGE_ACCESS_KEY:}
    cloud_storage_secret_key: ${NURSERY_STORAGE_SECRET_KEY:}
    working_dir: "/var/cache/nursery"
    meta_default_poll_interval_secs: {{ .Values.config.metaPollIntervalSecs }}
    stream_timeout_secs: {{ .Values.config.streamTimeoutSecs }}
    {{- /* int64: Helm reads every number as float64, so anything past ~1e7
           renders as scientific notation and no integer field parses it. */}}
    {{- if hasKey .Values.config "mergeAgeTriggerSecs" }}
    merge_age_trigger_secs: {{ int64 .Values.config.mergeAgeTriggerSecs }}
    {{- end }}
    {{- if hasKey .Values.config "mergeMinBytes" }}
    merge_min_bytes: {{ int64 .Values.config.mergeMinBytes }}
    {{- end }}
    {{- if hasKey .Values.config "mergeMaxSizeBytes" }}
    merge_max_size_bytes: {{ int64 .Values.config.mergeMaxSizeBytes }}
    {{- end }}
    {{- if hasKey .Values.config "mergeWriterMemoryBudget" }}
    merge_writer_memory_budget: {{ int64 .Values.config.mergeWriterMemoryBudget }}
    {{- end }}
    {{- if hasKey .Values.config "combineMinRun" }}
    combine_min_run: {{ int64 .Values.config.combineMinRun }}
    {{- end }}
    {{- if hasKey .Values.config "combineMaxBytes" }}
    combine_max_bytes: {{ int64 .Values.config.combineMaxBytes }}
    {{- end }}
    {{- if hasKey .Values.config "combineMaxConcurrent" }}
    combine_max_concurrent: {{ int64 .Values.config.combineMaxConcurrent }}
    {{- end }}
    {{- if hasKey .Values.config "combineBackoffSecs" }}
    combine_backoff_secs: {{ int64 .Values.config.combineBackoffSecs }}
    {{- end }}
    {{- if .Values.config.queryGrpcBind }}
    query_grpc_bind: {{ .Values.config.queryGrpcBind | quote }}
    qws_bin: "/qws_bin"
    {{- end }}
    {{- include "berserk-common.observability-config" . | nindent 4 }}
{{- end }}
{{- include "berserk-common.configmap" . }}
