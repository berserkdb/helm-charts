{{- if gt (int .Values.replicaCount) 1 }}
{{- fail "nursery must run a single replica: its node id is the cluster-registry identity that stream-group ownership is fenced on, and a fixed NURSERY_NODE_ID is stable AND unique only at replicaCount=1. For N>=2, switch to a StatefulSet so each pod gets a distinct stable id." }}
{{- end }}
{{- include "berserk-common.deployment.header" . }}
{{- include "berserk-common.serviceAccountName" . }}
      containers:
        - name: nursery
          image: {{ include "berserk-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default .Values.global.imagePullPolicy | default "Always" }}
          securityContext:
            allowPrivilegeEscalation: false
          command: ["/nursery_bin"]
          args:
            - "--config"
            - "/config/config.yaml"
          ports:
            - containerPort: {{ .Values.service.port }}
              name: health
            {{- /* NurseryQueryService gRPC port — exposed only when
                  `query_grpc_bind` is configured. The bind value is
                  parsed for its port number; declaring it on the
                  pod is informational (kubelet doesn't require it),
                  but pairs naturally with the NetworkPolicy rule. */ -}}
            {{- if .Values.config.queryGrpcBind }}
            - containerPort: {{ regexReplaceAll ".*:" .Values.config.queryGrpcBind "" | int }}
              name: query-grpc
              protocol: TCP
            {{- end }}
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: RUST_BACKTRACE
              value: "1"
            {{- /* Stable node id for the cluster registry. The nursery's node id
                  is the key stream-group ownership is fenced on; a fixed value
                  (vs the per-rollout-churning pod HOSTNAME) lets a redeployed
                  pod re-own its groups immediately instead of waiting out the
                  liveness TTL for a fresh id. Single-replica only — enforced by
                  the replicaCount guard above. */ -}}
            {{- if .Values.nodeId }}
            - name: NURSERY_NODE_ID
              value: {{ .Values.nodeId | quote }}
            {{- end }}
            {{- /* `NurseryQueryService` binds 0.0.0.0:<port> but the
                  cluster registry needs a routable URL — the pod IP.
                  Plumbed via the downward API so each nursery
                  advertises its own pod's IP, not the bind wildcard.
                  Only emitted when query_grpc_bind is configured. */ -}}
            {{- if .Values.config.queryGrpcBind }}
            - name: NURSERY_QUERY_GRPC_MEMBER_ENDPOINT
              value: "http://$(POD_IP):{{ regexReplaceAll ".*:" .Values.config.queryGrpcBind "" | int }}"
            {{- end }}
            {{- include "berserk-common.env.cluster-name" . | nindent 12 }}
            {{- include "berserk-common.env.s3-credentials" (dict "accessKeyEnv" "NURSERY_STORAGE_ACCESS_KEY" "secretKeyEnv" "NURSERY_STORAGE_SECRET_KEY" "Values" .Values) | nindent 12 }}
            {{- /* vsearch wiring. `BZRK_VSEARCH_FIELDS` is the process-wide
                  list of field NAMES/paths to index. The segment's VCEN
                  directory records name→id, so the query resolves the field by
                  name — services need the same field names, order irrelevant.
                  A non-empty list enables indexing and the nursery loads the
                  model from its baked-in image path (a build constant — see
                  `embedding::baked_model_paths`); there is no model-path env. */ -}}
            {{- if .Values.vsearch.fields }}
            - name: BZRK_VSEARCH_FIELDS
              value: {{ .Values.vsearch.fields | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/started
              port: health
            failureThreshold: 30
            periodSeconds: 3
          volumeMounts:
            {{- include "berserk-common.volumeMount.config" . | nindent 12 }}
            - name: working-dir
              mountPath: /var/cache/nursery
      volumes:
        {{- include "berserk-common.volume.config" . | nindent 8 }}
        - name: working-dir
          emptyDir:
            sizeLimit: {{ .Values.workingDir.sizeLimit }}
