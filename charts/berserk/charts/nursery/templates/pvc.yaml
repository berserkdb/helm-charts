{{- /* Optional working-dir PVC (workingDir.persistent). The nursery's
      disk-resident identity (the `nodeid` file) and baby-segment cache live
      in the working dir; a PVC keeps both across pod replacement, while the
      emptyDir default re-mints the identity and pays a stream-group failover
      on every replacement. Single RWO claim on a Deployment — sound only
      because `strategy: Recreate` stops the old pod (unmounting the volume)
      before the new one starts, and only at replicaCount=1 (render-guarded
      in deployment.yaml). */ -}}
{{- if hasKey .Values.workingDir "sizeLimit" }}
{{- fail "nursery.workingDir.sizeLimit was removed: the working dir is sized by nursery.workingDir.size (emptyDir sizeLimit by default, PVC request when workingDir.persistent is true). Rename the key to workingDir.size." }}
{{- end }}
{{- if .Values.workingDir.persistent }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "berserk-common.fullname" . }}-working-dir
  labels:
    {{- include "berserk-common.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.workingDir.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.workingDir.size | quote }}
{{- end }}
