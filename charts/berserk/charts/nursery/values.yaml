# Default values for nursery service
replicaCount: 1
component: backend

# Recreate strategy: stop old pod before starting new.
# The nursery owns stream offsets and merge state — running two instances
# simultaneously causes offset mismatch errors when both register segments.
strategy:
  type: Recreate

image:
  repository: nursery
  pullPolicy: Always
  tag: ""

service:
  type: ClusterIP
  port: 3002
  portName: health

# NetworkPolicy: egress to meta; query pods connect to NurseryQueryService.
# The embedded qws child binds 127.0.0.1, so no cross-pod ingress is
# needed for it — only the front-door `query_grpc_bind` port (9531)
# is exposed.
networkPolicy:
  allowExternal: false
  allowExternalEgress: true

  ingressFrom:
    - app: query
      ports: [{port: 9531}]
  egressTo:
    - app: meta
      ports: [{port: 9560}]
  additionalIngress: []
  additionalEgress: []

resources:
  requests:
    # +50 MB header room over pre-vsearch baseline for model mmap +
    # embedding cache + per-segment seal transients.
    # See docs/dev/vidx-vsearch-resources.md §4.
    memory: "320Mi"
    cpu: "200m"
  limits:
    # +100 MB over pre-vsearch baseline. The 8 MiB EmbeddingCache lives
    # here; per-merge transient stays the dominant factor and is bounded
    # by SegmentMergerConfig.
    memory: "1100Mi"
    cpu: "1000m"

# Working directory size limit for baby segments
workingDir:
  sizeLimit: "50Gi"

config:
  metaEndpoint: "http://meta:9560"
  # Polling interval for meta service in seconds
  metaPollIntervalSecs: 5
  # Stream inactivity timeout in seconds
  streamTimeoutSecs: 300
  # How long the brain waits before force-merging an idle/stopped
  # stream's remaining baby segments (seconds). Raising this keeps
  # `.ttseg` files local longer so the query-in-nursery lane has
  # something fresh to serve before the cloud-lane round-trip
  # completes. 60s matches the "~1 minute retention" that pairs with
  # `query.config.queryViaNursery=true`.
  forceMergeStaleThresholdSecs: 60
  # gRPC bind for the per-nursery `NurseryQueryService` that
  # apps/query's coordinator fans out to when `queryViaNursery` is on.
  # Empty disables (legacy HTTP-only nursery). `qws_bin` is bundled at
  # /qws_bin inside the nursery image whenever this is set; the
  # nursery spawns it as a child wired to NurseryLocalCache.
  queryGrpcBind: "0.0.0.0:9531"
  observability:
    serviceName: "nursery"
    logLevel: "info"

# vsearch (semantic-search) configuration. Off by default — opt in per
# environment by setting `fields`. Empty `fields` keeps the feature
# inactive: no model load, no template stamping at ingest, no
# VCEN/VTPH/VTPC written at seal. Production-grade per-table opt-in lands
# later (`docs/dev/vidx-vsearch-impl-plan.md` Deferred → "Meta tier-0
# integration").
#
# The embedding model is baked into the image at a fixed path (a build
# constant; see `embedding::baked_model_paths`) — there is no model-path knob.
vsearch:
  fields: ""
