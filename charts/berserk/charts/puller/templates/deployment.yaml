{{- if gt (int .Values.replicaCount) 1 }}
{{- fail (printf "puller: replicaCount is %d; run exactly one puller per install" (int .Values.replicaCount)) }}
{{- end }}
{{- include "berserk-common.deployment.header" . }}
{{- /* The install's service account: on GKE its Workload Identity is the Google
      identity customers grant on their subscriptions. */}}
{{- include "berserk-common.serviceAccountName" . }}
      {{- if .Values.global.symbols.enabled }}
      initContainers:
        {{- include "berserk-common.initContainer.symbols" . | nindent 8 }}
      {{- end }}
      containers:
        - name: puller
          image: {{ include "berserk-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default .Values.global.imagePullPolicy | default "Always" }}
          securityContext:
            allowPrivilegeEscalation: false
          args:
            - "--config"
            - "/config/config.yaml"
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
              protocol: TCP
          env:
            - name: BZRK_PULLER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.authPostgresCredentials.secretName }}
                  key: {{ .Values.global.authPostgresCredentials.databaseUrlKey }}
            # The cluster token and the key sealing sources' ingest tokens
            # derive from the master key.
            {{- include "berserk-common.env.master-key" . | nindent 12 }}
            - name: RUST_BACKTRACE
              value: "1"
            {{- include "berserk-common.env.cluster-name" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /health/started
              port: http
            failureThreshold: 60
            periodSeconds: 3
          volumeMounts:
            {{- include "berserk-common.volumeMount.config" . | nindent 12 }}
            {{- include "berserk-common.volumeMount.symbols" . | nindent 12 }}
      volumes:
        {{- include "berserk-common.volume.config" . | nindent 8 }}
        {{- include "berserk-common.volume.symbols" . | nindent 8 }}
