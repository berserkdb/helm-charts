{{- include "berserk-common.deployment.header" . }}
{{- include "berserk-common.serviceAccountName" . }}
      containers:
        - name: janitor
          image: {{ include "berserk-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default .Values.global.imagePullPolicy | default "Always" }}
          securityContext:
            allowPrivilegeEscalation: false
          command: ["/janitor_bin"]
          args:
            - "--config"
            - "/config/config.yaml"
          ports:
            - containerPort: 9502
              name: health
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: RUST_BACKTRACE
              value: "1"
            {{- include "berserk-common.env.s3-pool" . | nindent 12 }}
            {{- include "berserk-common.env.cluster-name" . | nindent 12 }}
            {{- include "berserk-common.env.s3-credentials" (dict "accessKeyEnv" "JANITOR_STORAGE_ACCESS_KEY" "secretKeyEnv" "JANITOR_STORAGE_SECRET_KEY" "Values" .Values) | nindent 12 }}
            {{- /* vsearch wiring (PR 11). Janitor needs only
                  `BZRK_VSEARCH_FIELDS` — the merger reads per-template
                  embeddings from input VTPCs, never invokes the model.
                  Use the same field NAMES as nursery (order irrelevant —
                  the merger reconciles input fields by name). */ -}}
            {{- if .Values.vsearch.fields }}
            - name: BZRK_VSEARCH_FIELDS
              value: {{ .Values.vsearch.fields | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            {{- include "berserk-common.volumeMount.config" . | nindent 12 }}
            - name: cache
              mountPath: /tmp/segment-cache
      volumes:
        {{- include "berserk-common.volume.config" . | nindent 8 }}
        - name: cache
          emptyDir:
            sizeLimit: {{ .Values.cache.size }}
