# Default values for janitor service
replicaCount: 1
component: backend

image:
  repository: janitor
  pullPolicy: Always
  tag: ""

# NetworkPolicy: egress to meta and query; nothing connects to janitor
networkPolicy:
  allowExternal: false
  allowExternalEgress: true

  ingressFrom: []
  egressTo:
    - app: meta
      ports: [{port: 9560}]
    - app: query
      ports: [{port: 9510}]
  additionalIngress: []
  additionalEgress: []

resources:
  # Standalone-subchart fallback only — the berserk umbrella overrides these
  # for every real deploy (see charts/berserk/values.yaml janitor.resources,
  # which carries the load-bearing sizing rationale). Kept in sync to avoid a
  # self-contradictory repo.
  requests:
    memory: "512Mi"
    cpu: "1500m"
  limits:
    memory: "4Gi"
    cpu: "4000m"

cache:
  # Standalone-subchart fallback; the umbrella overrides this (see
  # charts/berserk/values.yaml janitor.cache for the sizing rationale).
  size: "30Gi"

# vsearch (semantic-search) merger configuration. The janitor consumes
# `BZRK_VSEARCH_FIELDS` to know which fields' VCEN/VTPH/VTPC/VIDF chunks
# to rebuild during cloud-segment merge — same field NAMES as nursery/query
# (order irrelevant; the merger reconciles input fields by name). It reads
# per-template embeddings from input VTPCs and never calls Model::encode,
# so this image deliberately does NOT bake in the model artifact
# (`docs/dev/vidx-vsearch-impl-plan.md` §8 Cross-cutting decisions).
# Off by default — opt in per environment by setting `fields`. Empty
# `fields` makes the merger skip the VXXX rebuild path entirely.
vsearch:
  fields: ""

config:
  metaEndpoint: "http://meta:9560"
  queryEndpoint: "http://query:9510"
  mergerIntervalSeconds: 300
  maxSegmentsPerBatch: 50
  minSegments: 3
  maxSegmentAgeDays: 7
  targetTables: []
  # Merge scratch dir. Janitor builds multi-GiB transient files here during
  # cloud-segment merges, so this MUST be the large pod-internal `cache`
  # volume (emptyDir mounted at /tmp/segment-cache) — NOT the container's
  # system-wide /tmp, which is often a small tmpfs that would fill instantly.
  cacheDir: "/tmp/segment-cache"
  observability:
    serviceName: "janitor"
    logLevel: "info"
    otlpEnabled: false
    otlpEndpoint: ""
