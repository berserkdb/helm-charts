{{ include "berserk-common.configmap.metadata" . }}
data:
  config.yaml: |
    meta_endpoint: {{ .Values.config.metaEndpoint | quote }}

    http_bind: "0.0.0.0:{{ .Values.service.ports.otlpHttp }}"
    grpc_bind: "0.0.0.0:{{ .Values.service.ports.otlpGrpc }}"
    health_bind: "0.0.0.0:{{ .Values.service.ports.health }}"

    require_auth: {{ .Values.config.requireAuth }}
    lax_utf8: {{ .Values.config.laxUtf8 }}

    loki_enabled: {{ .Values.config.lokiEnabled }}
    {{- if .Values.config.lokiEnabled }}
    loki_bind: "0.0.0.0:{{ .Values.service.ports.loki }}"
    {{- end }}

    max_batch_bytes: {{ int .Values.config.batch.maxBatchBytes }}
    max_batch_age_secs: {{ .Values.config.batch.maxBatchAgeSecs }}
    keep_alive_interval_secs: {{ .Values.config.batch.keepAliveIntervalSecs }}

    max_inflight: {{ .Values.config.maxInflight }}

    {{- include "berserk-common.observability-config" . | nindent 4 }}
