{{ include "berserk-common.configmap.metadata" . }}
data:
  config.yaml: |
    extensions:
      file_storage:
        directory: /var/lib/tjalfe

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:{{ .Values.service.ports.otlpGrpc }}"
            # Allow invalid UTF-8 in string fields (e.g., journald binary data)
            lax_utf8: true
          http:
            endpoint: "0.0.0.0:{{ .Values.service.ports.otlpHttp }}"
            # Allow invalid UTF-8 in string fields (e.g., journald binary data)
            lax_utf8: true

    processors:
      batch:
        send_batch_size: {{ .Values.config.batch.sendBatchSize }}
        timeout: {{ .Values.config.batch.timeout }}
        send_batch_max_size: {{ .Values.config.batch.sendBatchMaxSize }}
      # Kubernetes attributes enrichment
      k8sattributes:
        auth_type: serviceAccount
        passthrough: {{ .Values.config.k8sAttributes.passthrough }}
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.daemonset.name
            - k8s.statefulset.name
            - k8s.node.name
            - k8s.container.name
          labels:
            - tag_name: app
              key: app
              from: pod
            - tag_name: version
              key: version
              from: pod
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: connection

    exporters:
      berserk:
        meta_endpoint: {{ .Values.config.metaEndpoint | quote }}
        s3_access_key: "${env:AWS_ACCESS_KEY_ID}"
        s3_secret_key: "${env:AWS_SECRET_ACCESS_KEY}"
        max_batch_bytes: 4194304
        max_batch_age_secs: 2
        keep_alive_interval_secs: 120
        {{- if .Values.config.ingestToken.secretName }}
        default_ingest_token: "${env:DEFAULT_INGEST_TOKEN}"
        {{- end }}


      debug:
        verbosity: basic
        sampling_initial: 5
        sampling_thereafter: 200

    service:
      extensions: [file_storage]

      pipelines:
        logs:
          receivers: [otlp]
          processors: [k8sattributes, batch]
          exporters: [berserk]

        metrics:
          receivers: [otlp]
          processors: [k8sattributes, batch]
          exporters: [berserk]

        traces:
          receivers: [otlp]
          processors: [k8sattributes, batch]
          exporters: [berserk]

      telemetry:
{{- $otlpEnabled := .Values.config.observability.otlpEnabled | default .Values.global.observability.otlpEnabled }}
{{- $otlpEndpoint := .Values.config.observability.otlpEndpoint | default .Values.global.observability.otlpEndpoint }}
{{- if $otlpEnabled }}
        resource:
          service.name: {{ .Values.config.observability.serviceName | quote }}
        logs:
          level: {{ .Values.config.observability.logLevel | quote }}
          processors:
            - batch:
                exporter:
                  otlp:
                    protocol: grpc
                    endpoint: {{ $otlpEndpoint | quote }}
                    insecure: true
        metrics:
          level: basic
          address: "0.0.0.0:{{ .Values.service.ports.telemetry }}"
          readers:
            - periodic:
                exporter:
                  otlp:
                    protocol: grpc
                    endpoint: {{ $otlpEndpoint | quote }}
                    insecure: true
        traces:
          processors:
            - batch:
                exporter:
                  otlp:
                    protocol: grpc
                    endpoint: {{ $otlpEndpoint | quote }}
                    insecure: true
{{- end }}
