{{/* ServiceAccount: needed when token is managed (and no global SA) */}}
{{- $managed := include "ingest.tokenManaged" . | trim | eq "true" }}
{{- $hasGlobalSA := .Values.global.serviceAccountName }}
{{- $needsSA := and $managed (not $hasGlobalSA) }}
{{- if $needsSA }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "berserk-common.fullname" . }}
  labels:
    {{- include "berserk-common.labels" . | nindent 4 }}
{{- end }}
{{- if $managed }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "berserk-common.fullname" . }}-token-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "berserk-common.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ include "ingest.tokenSecretName" . | trim | quote }}]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "berserk-common.fullname" . }}-token-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "berserk-common.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "berserk-common.fullname" . }}-token-init
subjects:
  - kind: ServiceAccount
    name: {{ $hasGlobalSA | default (include "berserk-common.fullname" .) }}
    namespace: {{ .Release.Namespace }}
{{- end }}
