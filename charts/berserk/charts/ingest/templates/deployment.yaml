{{- include "berserk-common.deployment.header" . }}
      # k8s injects service-link env vars like INGEST_SERVICE_HOST / INGEST_PORT
      # into every pod in the namespace. Figment's Env::prefixed("INGEST_") would
      # pick these up as config keys and the deny_unknown_fields guard would fail.
      enableServiceLinks: false
      {{- if .Values.global.serviceAccountName }}
      serviceAccountName: {{ .Values.global.serviceAccountName }}
      {{- end }}
      containers:
        - name: ingest
          image: {{ include "berserk-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default .Values.global.imagePullPolicy | default "Always" }}
          securityContext:
            allowPrivilegeEscalation: false
          command: ["/ingest_bin"]
          args:
            - "--config"
            - "/config/config.yaml"
          ports:
            - containerPort: {{ .Values.service.ports.otlpGrpc }}
              name: otlp-grpc
              protocol: TCP
            - containerPort: {{ .Values.service.ports.otlpHttp }}
              name: otlp-http
              protocol: TCP
            {{- if .Values.config.lokiEnabled }}
            - containerPort: {{ .Values.service.ports.loki }}
              name: loki
              protocol: TCP
            {{- end }}
            {{- if .Values.config.datadogEnabled }}
            - containerPort: {{ .Values.service.ports.datadog }}
              name: datadog
              protocol: TCP
            {{- end }}
            - containerPort: {{ .Values.service.ports.health }}
              name: health
              protocol: TCP
          env:
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
            - name: RUST_BACKTRACE
              value: "1"
            {{- include "berserk-common.env.s3-pool" . | nindent 12 }}
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            {{- include "berserk-common.env.cluster-name" . | nindent 12 }}
            {{- include "berserk-common.env.node-id" . | nindent 12 }}
            {{- include "berserk-common.env.s3-credentials" (dict "accessKeyEnv" "AWS_ACCESS_KEY_ID" "secretKeyEnv" "AWS_SECRET_ACCESS_KEY" "Values" .Values) | nindent 12 }}
            {{- include "berserk-common.env.master-key" . | nindent 12 }}
            - name: DEFAULT_INGEST_TOKEN_ENABLED
              value: {{ include "ingest.tokenEnabled" . | trim | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/started
              port: health
            failureThreshold: 30
            periodSeconds: 3
          volumeMounts:
            {{- include "berserk-common.volumeMount.config" . | nindent 12 }}
            {{- include "berserk-common.volumeMount.node-id" . | nindent 12 }}
      volumes:
        {{- include "berserk-common.volume.config" . | nindent 8 }}
        {{- include "berserk-common.volume.node-id" . | nindent 8 }}
