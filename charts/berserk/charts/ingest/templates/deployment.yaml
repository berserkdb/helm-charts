{{- include "berserk-common.deployment.header" . }}
{{- $managed := include "ingest.tokenManaged" . | trim | eq "true" }}
{{- $secretName := include "ingest.tokenSecretName" . | trim }}
{{- $secretKey := include "ingest.tokenKey" . | trim }}
      {{- if ne (.Values.config.k8sAttributes.passthrough | toString) "true" }}
      serviceAccountName: {{ include "berserk-common.fullname" . }}
      {{- else if .Values.global.serviceAccountName }}
      serviceAccountName: {{ .Values.global.serviceAccountName }}
      {{- else if $managed }}
      serviceAccountName: {{ include "berserk-common.fullname" . }}
      {{- end }}
      {{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
      {{- $secretHasKey := and $existingSecret (hasKey (default dict $existingSecret.data) $secretKey) }}
      {{- if and $managed (not $secretHasKey) }}
      initContainers:
        - name: init-ingest-token
          image: {{ include "ingest.cliImage" . }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "Always" }}
          securityContext:
            allowPrivilegeEscalation: false
          command: ["/bzrk"]
          args:
            - "--meta-endpoint"
            - {{ printf "meta.%s.svc.cluster.local:9500" .Release.Namespace | quote }}
            - "ingest-token"
            - "init"
            - {{ include "ingest.tokenName" . | trim | quote }}
            - "--dataset"
            - {{ .Values.global.defaultDataset | default "default" | quote }}
            - "--secret-name"
            - {{ $secretName | quote }}
            - "--secret-key"
            - {{ $secretKey | quote }}
          env:
            - name: K8S_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RUST_LOG
              value: "info"
      {{- end }}
      containers:
        - name: tjalfe
          image: {{ include "berserk-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default .Values.global.imagePullPolicy | default "Always" }}
          securityContext:
            allowPrivilegeEscalation: false
          args:
            - "/config/config.yaml"
          ports:
            - containerPort: {{ .Values.service.ports.otlpGrpc }}
              name: otlp-grpc
              protocol: TCP
            - containerPort: {{ .Values.service.ports.otlpHttp }}
              name: otlp-http
              protocol: TCP
            - containerPort: {{ .Values.service.ports.loki }}
              name: loki
              protocol: TCP
            - containerPort: {{ .Values.service.ports.telemetry }}
              name: telemetry
              protocol: TCP
          env:
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: K8S_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            {{- include "berserk-common.env.s3-credentials" (dict "accessKeyEnv" "AWS_ACCESS_KEY_ID" "secretKeyEnv" "AWS_SECRET_ACCESS_KEY" "Values" .Values) | nindent 12 }}
            {{- if $secretName }}
            - name: DEFAULT_INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ $secretKey }}
                  optional: {{ not $managed }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: telemetry
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: telemetry
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            {{- include "berserk-common.volumeMount.config" . | nindent 12 }}
            - name: state
              mountPath: /var/lib/tjalfe
      volumes:
        {{- include "berserk-common.volume.config" . | nindent 8 }}
        - name: state
          emptyDir: {}
