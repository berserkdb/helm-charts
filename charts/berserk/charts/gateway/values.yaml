# Default values for gateway service
replicaCount: 1
component: gateway

image:
  repository: gateway
  pullPolicy: Always
  tag: ""

service:
  type: ClusterIP
  port: 9500
  # externalIPs: optional list of node-bound VIPs.
  externalIPs: []

# Optional second listener. The gateway serves the IDENTICAL surface on this
# extra port; both ports auto-detect HTTP/1.1 vs h2c per connection. Enable it
# when an upstream proxy (e.g. envoy) can't attach two backend protocols to a
# single downstream endpoint: point its HTTP/1.1 cluster at `service.port` and
# its h2c cluster at this one (route native gRPC `/api/grpc` to the h2c port).
# Disabled by default — the single auto-detecting `service.port` already carries
# HTTP, SSE, and gRPC together. When enabled, the chart binds the listener,
# exposes the port on the Service, and opens it on the NetworkPolicy.
extraListener:
  enabled: false
  port: 9501
  # Service/containerPort name (DNS-1123 label, ≤15 chars).
  name: grpc

# Ingress (optional). The gateway is the public edge — once exposed it
# terminates user-facing HTTPS and proxies to ui (HTTP) plus gRPC
# routes to meta/query/ingest.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  # - host: gateway.example.com
  #   paths:
  #     - path: /
  #       pathType: Prefix
  tls: []
  # - hosts: [gateway.example.com]
  #   secretName: gateway-tls
  # Traefik-only: when the Service is forwarded over h2c (for native gRPC),
  # WebSocket upgrades fail because they can't ride HTTP/2. Enabling this adds a
  # Traefik IngressRoute that forwards upgrade requests over HTTP/1.1 instead,
  # leaving all other traffic on the h2c Ingress. No effect on non-Traefik
  # ingresses (they pass WebSockets natively).
  websocketSplit: false
  websocketEntrypoint: "websecure"

# NetworkPolicy: ingress from anywhere (it IS the edge); egress to
# permissions, ui, meta, query, ingest, plus external for OIDC
# discovery + the shared Postgres.
networkPolicy:
  allowExternal: true
  allowExternalEgress: true

  ingressFrom: []
  egressTo:
    # Catch-all upstream (config.upstreamBaseUrl: http://ui) — the merged ui
    # serves both the data-plane and admin surfaces. ui's Service is port 80 ->
    # targetPort 9570 and NetworkPolicy matches the pod port, so this is 9570 —
    # mirrors ui's own ingressFrom rule.
    - app: ui
      ports: [{ port: 9570 }]
    - app: permissions
      ports: [{ port: 9580 }]
    - app: meta
      ports: [{ port: 9560 }]
    - app: query
      ports: [{ port: 9510 }]
    - app: ingest
      ports: [{ port: 4317 }]
  additionalIngress: []
  additionalEgress: []

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

config:
  # Public-facing base URL of the gateway (absolute OIDC redirect URIs
  # are minted from this). Leave empty to inherit `global.publicBaseUrl`;
  # set here only to override the install-wide URL for this service.
  publicBaseUrl: ""
  # Upstream — the catch-all the identity-injecting proxy forwards
  # every request to. One merged `ui` Service serves the data plane,
  # the workspace-admin pages (/admin/*), and /login (see
  # `apps/gateway/src/proxy.rs`). Operators don't normally touch this
  # — it follows directly from the umbrella chart's layout.
  upstreamBaseUrl: "http://ui"
  # gRPC routing table — JSON array of {package_prefix, upstream}.
  # The default fans out gRPC traffic to meta + query + ingest inside
  # the same namespace. Override to add routes or point at different
  # backends.
  grpcRoutes: |
    [
      {"package_prefix": "meta", "upstream": "http://meta:9560"},
      {"package_prefix": "query", "upstream": "http://query:9510"},
      {"package_prefix": "opentelemetry", "upstream": "http://ingest:4317"}
    ]
  permissions:
    baseUrl: "http://permissions:9580"
    requestTimeoutSecs: 10
    connectTimeoutSecs: 2
  # Deployment mode: "self_hosted" (default) or "saas".
  deploymentMode: "self_hosted"
  # Set the `Secure` flag on session/auth cookies. Default true; flip
  # to false only for plain-HTTP localhost development.
  cookieSecure: true
  # Whether assertion-based auth methods (OIDC, trusted-proxy) auto-create
  # users on first sight. Default true. Set false for "directory mode":
  # only users that already exist in the gateway authenticate; an unknown
  # email is rejected and never created. The first admin then comes from
  # the first-boot bootstrap. Applies to every provisioning method.
  autoProvisionUsers: true
  # Session / TTL knobs (seconds). Defaults mirror gateway's own
  # ConfigDraft::default.
  sessionTtlSecs: 1209600 # 14 d
  inviteTtlSecs: 604800 # 7 d
  resetTtlSecs: 3600 # 1 h
  oidcChallengeTtlSecs: 600 # 10 min
  grantOutboxTickSecs: 5
  grantOutboxRetryDelaySecs: 5
  grantOutboxBatchSize: 50
  sessionCleanupIntervalSecs: 3600

  observability:
    serviceName: "gateway"
    logLevel: "info,gateway=debug"
    # otlpEnabled / otlpEndpoint fall through to global.observability.*

  # OIDC IdP — single operator-configured provider. Leave the block
  # `enabled: false` (default) for password-only deployments. When
  # enabled, the chart emits the `oidc_*` keys into config.yaml AND
  # wires `GATEWAY_OIDC_CLIENT_SECRET` from
  # `secrets.oidcClientSecret.existingSecret.{name,key}`.
  #
  # `bootstrapAdminEmails` is required for OIDC-only deployments
  # (`deployment_mode: saas`, or `bootstrap.disabled: true`): without
  # at least one entry the first user can sign in but no one has the
  # `AdminManageInvites` permission, leaving the admin surfaces
  # locked. See docs/operations/admin/ui-setup → Path C.
  oidc:
    enabled: false
    issuer: ""
    clientId: ""
    # YAML list. Required scopes (openid email profile) are unioned
    # in by gateway regardless of what you set here; safe to add
    # extras like `offline_access` or `groups`.
    scopes: []
    requireEmailVerified: true
    # YAML list of email addresses to auto-promote to cluster admin
    # on first OIDC sign-in. Lower-cased + validated at gateway
    # startup. Empty (default) = nobody gets auto-admin; existing
    # admins keep whatever was granted via `permission_tuples`.
    bootstrapAdminEmails: []

  # Trusted reverse-proxy (PP) auth — trust identity headers from an
  # upstream authenticating proxy. Leave `enabled: false` (default)
  # unless an upstream proxy in front of the gateway asserts the user.
  # Identity is trusted on network grounds alone (no cryptographic
  # verification), so the gateway must be unreachable except through the
  # proxy. When enabled, configure at least one extraction strategy below.
  # See docs/operations/admin/ui-setup → Path D.
  trustedProxy:
    enabled: false
    # Strategy 1 — direct email header (e.g. X-PP-USER) carrying a full
    # user email. Leave empty to disable this strategy. Must not collide
    # with X-Bzrk-* or the stripped reverse-proxy aliases
    # (X-Forwarded-User, Remote-User, …).
    userHeader: ""
    # Strategy 2 — SPIFFE on-behalf-of. The upstream forwards a SPIFFE
    # identity (spiffe://<trust-domain>/user/<name>) in `header`; the
    # gateway strips `spiffePrefix` to recover the username and appends
    # `@emailDomain` to form the identity email.
    onBehalfOf:
      enabled: false
      header: "on-behalf-of"
      spiffePrefix: "" # e.g. "spiffe://prod.example.net/user/"
      emailDomain: "" # e.g. "example.com"
    # YAML list restricting auto-provisioning to these email domains.
    # Empty (default) allows any domain.
    allowedDomains: []
    # YAML list of emails auto-promoted to cluster admin on first sign-in.
    adminEmails: []

# Secrets — gateway needs three: cookie signing key, its own service
# token (X-Bzrk-Service-Token to ui), and the permissions
# service token. By default the chart manages a Secret with random
# values; set `managed: false` to reference an existing Secret.
#
# Flipping `managed: true → false` on an existing release: the
# chart-created Secret survives and blocks any external pipeline from
# adopting it. Annotate it with `sealedsecrets.bitnami.com/managed=true`,
# or delete it, before the external pipeline reconciles.
secrets:
  managed: true
  secretName: "gateway-secrets"
  # Set these to non-empty strings to override the auto-generated
  # random values. `lookup` preserves existing data across upgrades.
  cookieSigningKey: ""
  serviceToken: ""
  permissionsServiceToken: ""

  # OIDC client_secret — referenced from a separate, externally-
  # managed Secret (SealedSecret in dev/valhalla). When
  # `config.oidc.enabled: true`, the deployment template wires
  # `GATEWAY_OIDC_CLIENT_SECRET` from the named key on the named
  # Secret. Must be at least 32 chars (gateway's config validator
  # rejects shorter values to bound the leak surface of the
  # `/admin/config` operator-view page).
  oidcClientSecret:
    existingSecret:
      name: ""
      key: ""

# Bootstrap admin (optional). When email + password are set, gateway
# creates the first admin user at startup instead of printing a
# one-time setup link. Mutually exclusive with `bootstrapDisabled`.
bootstrap:
  disabled: false
  adminEmail: ""
  adminGivenName: ""
  adminFamilyName: ""
  adminPassword: ""

# Extra env vars / envFrom — escape hatch for one-off env we don't
# (yet) have first-class chart support for. The `oidc.*` block above
# is the right shape for OIDC client_secret wiring; reach for
# `extraEnvFrom` only when first-class support is genuinely missing.
extraEnv: []
extraEnvFrom: []
