{{- /*
Traefik route so WebSocket upgrades reach the gateway over HTTP/1.1. The plain
Ingress forwards to the gateway over h2c (needed for native gRPC); a WebSocket
upgrade can't ride HTTP/2, so on the h2c path it fails. This higher-priority
IngressRoute matches only upgrade requests and forwards them with scheme http;
all other traffic still matches the plain Ingress and stays on h2c. Traefik-only;
opt in with ingress.websocketSplit (non-Traefik ingresses pass WS by default).
*/ -}}
{{- if .Values.ingress.enabled }}
{{- $schemeKey := "traefik.ingress.kubernetes.io/service.serversscheme" }}
{{- $scheme := index (.Values.service.annotations | default dict) $schemeKey | default (index (.Values.ingress.annotations | default dict) $schemeKey) | default "" }}
{{- if and (eq ($scheme | toString) "h2c") (kindIs "invalid" .Values.ingress.websocketSplit) }}
{{- fail (printf "gateway: %s is h2c but gateway.ingress.websocketSplit is unset. Traefik then speaks HTTP/2 to the gateway, WebSocket upgrades cannot ride HTTP/2, and the LiveView UI fails to connect (it degrades to longpoll, or hangs on clients without that fallback). Set websocketSplit=true to add a Traefik IngressRoute forwarding upgrades over HTTP/1.1, or websocketSplit=false if WebSockets reach the gateway another way." $schemeKey) }}
{{- end }}
{{- end }}
{{- if and .Values.ingress.enabled .Values.ingress.websocketSplit }}
{{- $svc := include "berserk-common.fullname" . }}
{{- $port := .Values.service.port }}
{{- $entrypoint := .Values.ingress.websocketEntrypoint | default "websecure" }}
{{- range $h := .Values.ingress.hosts }}
{{- $secret := "" }}
{{- range $t := $.Values.ingress.tls }}{{- if has $h.host $t.hosts }}{{- $secret = $t.secretName }}{{- end }}{{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ printf "%s-ws-%s" $svc ($h.host | replace "." "-") | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "berserk-common.labels" $ | nindent 4 }}
spec:
  entryPoints:
    - {{ $entrypoint }}
  routes:
    - match: Host(`{{ $h.host }}`) && HeaderRegexp(`Upgrade`, `(?i)^websocket$`)
      kind: Rule
      priority: 1000
      services:
        - name: {{ $svc }}
          port: {{ $port }}
          scheme: http
  {{- if $secret }}
  tls:
    secretName: {{ $secret }}
  {{- end }}
{{- end }}
{{- end }}
