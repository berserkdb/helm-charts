{{- if .Values.secrets.managed }}
{{- $secretName := .Values.secrets.secretName }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $cookieKey := "" }}
{{- if .Values.secrets.cookieSigningKey }}
  {{- $cookieKey = .Values.secrets.cookieSigningKey | b64enc }}
{{- else if and $existing $existing.data (index $existing.data "cookie_signing_key") }}
  {{- $cookieKey = index $existing.data "cookie_signing_key" }}
{{- else }}
  {{- $cookieKey = randAlphaNum 64 | b64enc }}
{{- end }}
{{- $serviceToken := "" }}
{{- if .Values.secrets.serviceToken }}
  {{- $serviceToken = .Values.secrets.serviceToken | b64enc }}
{{- else if and $existing $existing.data (index $existing.data "service_token") }}
  {{- $serviceToken = index $existing.data "service_token" }}
{{- else }}
  {{- $serviceToken = randAlphaNum 48 | b64enc }}
{{- end }}
{{- $permToken := "" }}
{{- if .Values.secrets.permissionsServiceToken }}
  {{- $permToken = .Values.secrets.permissionsServiceToken | b64enc }}
{{- else if and $existing $existing.data (index $existing.data "permissions_service_token") }}
  {{- $permToken = index $existing.data "permissions_service_token" }}
{{- else }}
  {{- $permToken = randAlphaNum 48 | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "berserk-common.labels" . | nindent 4 }}
type: Opaque
data:
  cookie_signing_key: {{ $cookieKey }}
  service_token: {{ $serviceToken }}
  permissions_service_token: {{ $permToken }}
  {{- if .Values.bootstrap.adminPassword }}
  bootstrap_admin_password: {{ .Values.bootstrap.adminPassword | b64enc }}
  {{- else if and $existing $existing.data (index $existing.data "bootstrap_admin_password") }}
  bootstrap_admin_password: {{ index $existing.data "bootstrap_admin_password" }}
  {{- end }}
{{- end }}
