# Default values for query service
replicaCount: 1
component: backend

image:
  repository: query
  pullPolicy: Always
  tag: ""

service:
  type: ClusterIP
  port: 9510

cache:
  enabled: true
  # persistent: true uses a PVC (StatefulSet), false uses emptyDir (Deployment).
  persistent: true
  size: "128Gi"
  storageClass: ""
  # hostPath: set to a path (e.g. /mnt/nvme) to use a local NVMe mount instead of emptyDir.
  # Only used when persistent is false.
  hostPath: ""

resources:
  requests:
    memory: "1Gi"
    cpu: "2000m"
  limits:
    memory: "16Gi"
    cpu: "8000m"

config:
  metaEndpoint: "http://meta:9500"
  observability:
    serviceName: "query"
    logLevel: "info"
    otlpEnabled: false
    otlpEndpoint: ""
