apiVersion: apps/v1
{{- if and .Values.cache.enabled .Values.cache.persistent }}
kind: StatefulSet
{{- else }}
kind: Deployment
{{- end }}
metadata:
  name: {{ include "berserk-common.fullname" . }}
  labels:
    {{- include "berserk-common.labels" . | nindent 4 }}
    component: {{ .Values.component | default "backend" }}
spec:
  {{- if and .Values.cache.enabled .Values.cache.persistent }}
  serviceName: {{ include "berserk-common.fullname" . }}
  {{- end }}
  {{- if and (not .Values.cache.persistent) .Values.cache.hostPath }}
  # Deployment + node-local hostPath cache: the cache_server holds an exclusive
  # UDS socket/lock in the cache dir, so the default RollingUpdate (which surges
  # a second pod, possibly onto the same node, both bound to the same
  # /mnt/nvme/<customer> dir) would conflict. maxSurge: 0 stops the new pod from
  # coming up before the old one is gone. We stay on RollingUpdate rather than
  # Recreate because k8s rejects an in-place switch to type=Recreate while a
  # live Deployment still carries spec.strategy.rollingUpdate. (The StatefulSet
  # form updates one-at-a-time and needs none of this.)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  {{- end }}
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit | default 2 }}
  selector:
    matchLabels:
      {{- include "berserk-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "berserk-common.selectorLabels" . | nindent 8 }}
        component: {{ .Values.component | default "backend" }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # k8s injects service-link env vars like QUERY_SERVICE_HOST / QUERY_PORT
      # into every pod in the namespace. Figment's Env::prefixed("QUERY_") would
      # pick these up as config keys and the deny_unknown_fields guard would fail.
      enableServiceLinks: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
{{- include "berserk-common.scheduling" . }}
{{- include "berserk-common.serviceAccountName" . }}
      {{- if and .Values.cache.enabled .Values.cache.hostPath }}
      # hostPath segment cache (e.g. /mnt/nvme/<customer> on the instance-store
      # NVMe): the kubelet creates the dir as root:0755 and hostPath volumes
      # ignore fsGroup, so the non-root query process (uid 1000) can't write to
      # it. Chown it to the pod's uid/gid once, as root, before query starts.
      initContainers:
        - name: init-segment-cache
          image: {{ include "berserk-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default .Values.global.imagePullPolicy | default "Always" }}
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
          command: ["/bin/sh", "-c"]
          args:
            - "mkdir -p /segment_cache && chown 1000:1000 /segment_cache"
          volumeMounts:
            - name: segment-cache
              mountPath: /segment_cache
      {{- end }}
      containers:
        - name: query
          image: {{ include "berserk-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default .Values.global.imagePullPolicy | default "Always" }}
          securityContext:
            allowPrivilegeEscalation: false
          command: ["/query_bin"]
          args:
            - "--config"
            - "/config/config.yaml"
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
              protocol: TCP
            {{- /* When transport=grpc, apps/query forks a qws child
                  at startup. The forked qws binds its inbound gRPC
                  on this pod's network namespace, so the inbound
                  port lives on the query container (formerly on a
                  separate qws sidecar container). */ -}}
            {{- if and (hasKey .Values.config "transport") (eq .Values.config.transport "grpc") }}
            - containerPort: {{ .Values.qws.port | default 9520 }}
              name: qws-grpc
              protocol: TCP
            {{- end }}
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: RUST_BACKTRACE
              value: "1"
            - name: _RJEM_MALLOC_CONF
              value: "prof:true,prof_active:true,lg_prof_sample:19"
            {{- /* The cache_server / qws / query binaries are bundled
                  side-by-side under `/` by `apps/query`'s `pkg_tar`
                  (see apps/query/BUILD.bazel:query_binary_tar). Any
                  child-spawn resolver in this codebase first checks
                  `BZRK_*_BIN` for an explicit override, then looks for
                  a sibling next to `current_exe()`, then falls back to
                  `$PATH`. Production hits the sibling lookup — no env
                  wiring needed. The override stays available for tests
                  that point at an out-of-tree build. */}}
            {{- /* Wait/off-CPU profiler toggle. `bzrk_bootstrap`
                  honours BZRK_WAIT_PROFILER on every binary it
                  inits — the env propagates through fork+exec so
                  qws and cache_server children inherit it
                  unchanged from the query parent. Used for
                  diagnosing contention regressions; off by default
                  because wait sampling has signal-handling
                  overhead. */ -}}
            {{- if and (hasKey .Values.config.observability "waitProfilerEnabled") .Values.config.observability.waitProfilerEnabled }}
            - name: BZRK_WAIT_PROFILER
              value: "1"
            {{- end }}
            {{- /* Cache otherwise-unbinned `summarize` queries by injecting an
                  invisible event-time bin (collapsed before output). Read by
                  the query coordinator during plan lowering. Off by default;
                  enabled on dev to dogfood before any public rollout. */ -}}
            {{- if and (hasKey .Values.config "cacheUnbinned") .Values.config.cacheUnbinned }}
            - name: BZRK_CACHE_UNBINNED
              value: "1"
            {{- end }}
            {{- include "berserk-common.env.cluster-name" . | nindent 12 }}
            {{- include "berserk-common.env.s3-credentials" (dict "accessKeyEnv" "AWS_ACCESS_KEY_ID" "secretKeyEnv" "AWS_SECRET_ACCESS_KEY" "Values" .Values) | nindent 12 }}
            {{- /* When transport=grpc, apps/query forks a qws child
                  at startup. The qws inherits this container's env,
                  so the qws-only knobs (cache size, S3 creds for
                  cache_server, etc.) live here on the parent now —
                  no separate qws container, no separate cgroup. */ -}}
            {{- if and (hasKey .Values.config "transport") (eq .Values.config.transport "grpc") }}
            - name: BZRK_CACHE_SIZE_BYTES
              value: {{ .Values.cache.sizeBytes | default "0" | quote }}
            - name: BZRK_SEGMENT_CACHE_MAX_CONCURRENT_S3
              value: {{ .Values.cache.maxConcurrentS3Requests | default 0 | quote }}
            - name: BZRK_SEGMENT_CACHE_MAX_TOTAL_S3
              value: {{ .Values.cache.maxTotalConcurrentS3Requests | default 0 | quote }}
            - name: BZRK_QWS_EMBEDDED_BIND
              value: "0.0.0.0:{{ .Values.qws.port | default 9520 }}"
            - name: BZRK_QWS_CLOUD_STORAGE_ENDPOINT
              value: {{ .Values.global.storage.endpoint | quote }}
            {{- $isHttps := hasPrefix "https://" (.Values.global.storage.endpoint | default "") }}
            - name: BZRK_QWS_CLOUD_STORAGE_USE_SSL
              value: {{ $isHttps | quote }}
            {{- include "berserk-common.env.s3-credentials" (dict "accessKeyEnv" "BZRK_QWS_CLOUD_STORAGE_ACCESS_KEY" "secretKeyEnv" "BZRK_QWS_CLOUD_STORAGE_SECRET_KEY" "Values" .Values) | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /health/started
              port: http
            failureThreshold: 30
            periodSeconds: 3
          volumeMounts:
            {{- include "berserk-common.volumeMount.config" . | nindent 12 }}
            {{- if .Values.cache.enabled }}
            - name: segment-cache
              mountPath: /segment_cache
            {{- end }}
        {{- /* The qws (query-worker supervisor) used to live here as
              a separate sidecar container with its own cgroup, env
              block, and resources budget. That separation was an
              implementation detail leaking to k8s — and the wrong
              `qws.resources.limits.cpu` default (8 vCPU) silently
              capped the actual worker at far below the pod's budget.
              Now apps/query forks qws as a child of this container
              when transport=grpc (see apps/query/src/lib.rs::
              spawn_embedded_qws). Same process tree, same cgroup,
              same env, single inbound listener exposed via the
              `qws-grpc` port on this container. */}}
      volumes:
        {{- include "berserk-common.volume.config" . | nindent 8 }}
        {{- if and .Values.cache.enabled (not .Values.cache.persistent) }}
        - name: segment-cache
          {{- if .Values.cache.hostPath }}
          hostPath:
            path: {{ .Values.cache.hostPath }}
            type: DirectoryOrCreate
          {{- else }}
          emptyDir:
            sizeLimit: {{ .Values.cache.size }}
          {{- end }}
        {{- end }}
  {{- if and .Values.cache.enabled .Values.cache.persistent }}
  volumeClaimTemplates:
    - metadata:
        name: segment-cache
      spec:
        accessModes: [ "ReadWriteOnce" ]
        {{- with .Values.cache.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.cache.size }}
  {{- end }}
