apiVersion: apps/v1
{{- if and .Values.cache.enabled .Values.cache.persistent }}
kind: StatefulSet
{{- else }}
kind: Deployment
{{- end }}
metadata:
  name: {{ include "berserk-common.fullname" . }}
  labels:
    {{- include "berserk-common.labels" . | nindent 4 }}
    component: {{ .Values.component | default "backend" }}
spec:
  {{- if and .Values.cache.enabled .Values.cache.persistent }}
  serviceName: {{ include "berserk-common.fullname" . }}
  {{- end }}
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit | default 2 }}
  selector:
    matchLabels:
      {{- include "berserk-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "berserk-common.selectorLabels" . | nindent 8 }}
        component: {{ .Values.component | default "backend" }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # k8s injects service-link env vars like QUERY_SERVICE_HOST / QUERY_PORT
      # into every pod in the namespace. Figment's Env::prefixed("QUERY_") would
      # pick these up as config keys and the deny_unknown_fields guard would fail.
      enableServiceLinks: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
{{- include "berserk-common.scheduling" . }}
{{- include "berserk-common.serviceAccountName" . }}
      containers:
        - name: query
          image: {{ include "berserk-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default .Values.global.imagePullPolicy | default "Always" }}
          securityContext:
            allowPrivilegeEscalation: false
          command: ["/query_bin"]
          args:
            - "--config"
            - "/config/config.yaml"
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
              protocol: TCP
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: RUST_BACKTRACE
              value: "1"
            - name: _RJEM_MALLOC_CONF
              value: "prof:true,prof_active:true,lg_prof_sample:19"
            {{- include "berserk-common.env.cluster-name" . | nindent 12 }}
            {{- include "berserk-common.env.s3-credentials" (dict "accessKeyEnv" "AWS_ACCESS_KEY_ID" "secretKeyEnv" "AWS_SECRET_ACCESS_KEY" "Values" .Values) | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /health/started
              port: http
            failureThreshold: 30
            periodSeconds: 3
          volumeMounts:
            {{- include "berserk-common.volumeMount.config" . | nindent 12 }}
            {{- if .Values.cache.enabled }}
            - name: segment-cache
              mountPath: /segment_cache
            {{- end }}
      volumes:
        {{- include "berserk-common.volume.config" . | nindent 8 }}
        {{- if and .Values.cache.enabled (not .Values.cache.persistent) }}
        - name: segment-cache
          {{- if .Values.cache.hostPath }}
          hostPath:
            path: {{ .Values.cache.hostPath }}
            type: DirectoryOrCreate
          {{- else }}
          emptyDir:
            sizeLimit: {{ .Values.cache.size }}
          {{- end }}
        {{- end }}
  {{- if and .Values.cache.enabled .Values.cache.persistent }}
  volumeClaimTemplates:
    - metadata:
        name: segment-cache
      spec:
        accessModes: [ "ReadWriteOnce" ]
        {{- with .Values.cache.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.cache.size }}
  {{- end }}
