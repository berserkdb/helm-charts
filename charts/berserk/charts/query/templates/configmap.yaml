{{- define "query.config-data" -}}
data:
  config.yaml: |
    bind: "0.0.0.0:{{ .Values.service.port }}"
    meta_endpoint: {{ .Values.config.metaEndpoint | quote }}
    cloud_storage_access_key: ${AWS_ACCESS_KEY_ID:}
    cloud_storage_secret_key: ${AWS_SECRET_ACCESS_KEY:}
    max_concurrent_queries: {{ .Values.config.maxConcurrentQueries }}
    {{- if hasKey .Values.config "workersPerQuery" }}
    workers_per_query: {{ .Values.config.workersPerQuery }}
    {{- end }}

    {{- if hasKey .Values.cache "mode" }}
    cache_mode: {{ .Values.cache.mode | quote }}
    {{- end }}
    {{- if hasKey .Values.config "transport" }}
    transport: {{ .Values.config.transport | quote }}
    {{- end }}
    {{- if hasKey .Values.config "queryViaNursery" }}
    query_via_nursery: {{ .Values.config.queryViaNursery }}
    {{- end }}
    {{- if .Values.cache.enabled }}
    cache:
      dir: "/segment_cache"
    {{- /* Single cache-disk budget = the volume size. The query service
          derives the segment-cache and map-reduce-state-cache ceilings from
          it via the percentages below and validates they sum to < 100%.
          Appending "B" turns the k8s quantity (500Gi -> 500GiB) into a
          bytesize the binary parses; no arithmetic happens in the template. */}}
    cache_total_size: "{{ .Values.cache.size }}B"
    {{- if hasKey .Values.cache "segmentCachePercent" }}
    cache_segment_percent: {{ .Values.cache.segmentCachePercent }}
    {{- end }}
    {{- if hasKey .Values.cache "resultCachePercent" }}
    cache_result_percent: {{ .Values.cache.resultCachePercent }}
    {{- end }}
    {{- end }}
    {{- include "berserk-common.observability-config" . | nindent 4 }}
{{- end }}
{{- include "berserk-common.configmap" . }}
