# Default values for meta service
replicaCount: 1
component: backend

image:
  repository: meta
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion
  tag: ""

service:
  type: ClusterIP
  port: 9500

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "500m"

# NetworkPolicy: all other Berserk services connect to meta
networkPolicy:
  allowExternal: false
  allowExternalEgress: true

  ingressFrom:
    - app: query
      ports: [{port: 9500}]
    - app: ingest
      ports: [{port: 9500}]
    - app: janitor
      ports: [{port: 9500}]
    - app: ui
      ports: [{port: 9500}]
    - app: nursery
      ports: [{port: 9500}]
    # post-install setup job creates the default dataset via meta
    - app: setup
      ports: [{port: 9500}]
  egressTo: []
  additionalIngress: []
  additionalEgress: []

config:
  # storageEndpoint: ""
  # storageBucket: ""
  # storageRegion: "auto"
  observability:
    serviceName: "meta"
    logLevel: "info"
    # otlpEnabled: false
    # otlpEndpoint: ""
