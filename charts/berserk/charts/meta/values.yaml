# Default values for meta service
replicaCount: 1
component: backend

image:
  repository: meta
  # Overrides the image tag whose default is the chart appVersion
  tag: ""

service:
  type: ClusterIP
  port: 9560

resources:
  requests:
    memory: "128Mi"
    cpu: "200m"
  limits:
    memory: "256Mi"

# Extra env vars — escape hatch for env we don't (yet) have first-class chart
# support for.
extraEnv: []

# NetworkPolicy: all other Berserk services connect to meta
networkPolicy:
  allowExternal: false
  allowExternalEgress: true

  ingressFrom:
    # gateway proxies meta gRPC (grpcRoutes: meta -> meta:9560), e.g.
    # DatabaseService/ListDatabases issued from the UI and CLI.
    - app: gateway
      ports: [{port: 9560}]
    - app: query
      ports: [{port: 9560}]
    - app: ingest
      ports: [{port: 9560}]
    - app: janitor
      ports: [{port: 9560}]
    - app: ui
      ports: [{port: 9560}]
    - app: nursery
      ports: [{port: 9560}]
    # fleet registration only — permissions asks meta nothing else
    - app: permissions
      ports: [{port: 9560}]
    # audit-shipper reads the audit chain and reports what it archived
    - app: audit-shipper
      ports: [{port: 9560}]
    # puller creates each Pub/Sub source's ingest token and pipeline
    - app: puller
      ports: [{port: 9560}]
    # lookup-tables registers uploads, claims builds and commits versions
    - app: lookup-tables
      ports: [{port: 9560}]
    # ad-hoc admin pods an operator runs with the label `app: admin`
    - app: admin
      ports: [{port: 9560}]
  egressTo:
    - app: permissions
      ports: [{port: 9580}]
  additionalIngress: []
  additionalEgress: []

config:
  permissionsBaseUrl: "http://permissions:9580"

  # dbPool: {}  # pool sizing and timeouts; fields and defaults in libs/bzrk_db
  # storageEndpoint: ""
  # storageBucket: ""
  # storageRegion: "auto"
  # storagePath: ""  # object-key prefix within the bucket; empty = bucket root
  # storageProvider: ""  # "s3" or "gcs"; empty inherits global.storage.provider
  # Merge planner: per-table task limit = clamp(live janitors × tasksPerJanitor,
  # minMergeTasksPerTable, maxMergeTasksPerTable). Unset keys use the binary defaults.
  # merge:
  #   tasksPerJanitor: 2
  #   minMergeTasksPerTable: 3
  #   maxMergeTasksPerTable: 100
  # Stream liveness: how often an ingester writes a keep-alive to an idle
  # stream, and how long a silent stream lives before its nursery stops it.
  # Meta hands both out and refuses to start unless the reap is at least twice
  # the keep-alive. Unset keys use the binary defaults.
  # ingest:
  #   keepAliveInterval: 30s
  # nursery:
  #   streamReapAfter: 90s
  # Accept tokens meta mints for processes outside the cluster (`meta_bin mint-visitor-token`).
  acceptVisitorTokens: false
  # Lookup-table uploads (docs/dev/PLAN-lookup-tables.md). Turn on together with
  # lookup-tables.enabled and gateway.config.lookupTablesBaseUrl, once the bucket's lifecycle rule
  # aborts abandoned multipart uploads.
  lookupTablesEnabled: false
  # lookupTablesMaxDatabaseBytes: 549755813888  # 512 GiB: current versions of all lookup tables in one database
  observability:
    serviceName: "meta"
    logLevel: "info"
    # otlpEnabled: false
    # otlpEndpoint: ""
