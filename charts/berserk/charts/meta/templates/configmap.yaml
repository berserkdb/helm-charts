{{- define "meta.config-data" -}}
data:
  config.yaml: |
    bind: "0.0.0.0:{{ .Values.service.port }}"
    database_url: ${META_DATABASE_URL}
    {{- $storageEndpoint := .Values.config.storageEndpoint | default .Values.global.storage.endpoint }}
    {{- $storageBucket := .Values.config.storageBucket | default .Values.global.storage.bucket }}
    {{- $storageRegion := .Values.config.storageRegion | default .Values.global.storage.region }}
    {{- $storagePath := .Values.config.storagePath | default .Values.global.storage.path }}
    {{- $storageProvider := .Values.config.storageProvider | default .Values.global.storage.provider }}
    {{- if $storageEndpoint }}
    storage_endpoint: {{ $storageEndpoint | quote }}
    storage_bucket: {{ $storageBucket | quote }}
    storage_region: {{ $storageRegion | quote }}
    {{- if $storagePath }}
    storage_path: {{ $storagePath | quote }}
    {{- end }}
    {{- if $storageProvider }}
    storage_provider: {{ $storageProvider | quote }}
    {{- end }}
    {{- end }}
    {{- $merge := .Values.config.merge | default dict }}
    {{- if or $merge.tasksPerJanitor $merge.minMergeTasksPerTable $merge.maxMergeTasksPerTable }}
    merge:
      {{- with $merge.tasksPerJanitor }}
      tasks_per_janitor: {{ int . }}
      {{- end }}
      {{- with $merge.minMergeTasksPerTable }}
      min_merge_tasks_per_table: {{ int . }}
      {{- end }}
      {{- with $merge.maxMergeTasksPerTable }}
      max_merge_tasks_per_table: {{ int . }}
      {{- end }}
    {{- end }}
    {{- $dbPool := .Values.config.dbPool | default dict }}
    {{- $keys := list "maxConnections" "minConnections" "idleTimeoutSecs"
                      "acquireTimeoutSecs" "maxLifetimeSecs"
                      "statementTimeoutSecs" "idleInTransactionSecs" }}
    {{- $set := false }}
    {{- range $keys }}{{- if hasKey $dbPool . }}{{- $set = true }}{{- end }}{{- end }}
    {{- if $set }}
    db_pool:
      {{- if hasKey $dbPool "maxConnections" }}
      max_connections: {{ int $dbPool.maxConnections }}
      {{- end }}
      {{- if hasKey $dbPool "minConnections" }}
      min_connections: {{ int $dbPool.minConnections }}
      {{- end }}
      {{- if hasKey $dbPool "idleTimeoutSecs" }}
      idle_timeout_secs: {{ int $dbPool.idleTimeoutSecs }}
      {{- end }}
      {{- if hasKey $dbPool "acquireTimeoutSecs" }}
      acquire_timeout_secs: {{ int $dbPool.acquireTimeoutSecs }}
      {{- end }}
      {{- if hasKey $dbPool "maxLifetimeSecs" }}
      max_lifetime_secs: {{ int $dbPool.maxLifetimeSecs }}
      {{- end }}
      {{- if hasKey $dbPool "statementTimeoutSecs" }}
      statement_timeout_secs: {{ int $dbPool.statementTimeoutSecs }}
      {{- end }}
      {{- if hasKey $dbPool "idleInTransactionSecs" }}
      idle_in_transaction_secs: {{ int $dbPool.idleInTransactionSecs }}
      {{- end }}
    {{- end }}
    {{- include "berserk-common.observability-config" . | nindent 4 }}
{{- end }}
{{- include "berserk-common.configmap" . }}
