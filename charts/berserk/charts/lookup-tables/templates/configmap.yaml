{{- define "lookup-tables.config-data" -}}
data:
  config.yaml: |
    bind: "0.0.0.0:{{ .Values.service.port }}"
    meta_endpoint: {{ .Values.config.metaEndpoint | quote }}
    cloud_storage_access_key: ${LOOKUP_TABLES_STORAGE_ACCESS_KEY:}
    cloud_storage_secret_key: ${LOOKUP_TABLES_STORAGE_SECRET_KEY:}
    scratch_dir: "/scratch"
    sandbox: {{ .Values.config.sandbox | quote }}
    permissions_base_url: {{ .Values.config.permissionsBaseUrl | quote }}
    import_private_hosts: {{ .Values.config.importPrivateHosts }}
    max_upload_bytes: {{ int64 (required "global.lookupTablesMaxUploadBytes is required" .Values.global.lookupTablesMaxUploadBytes) }}
    max_value_bytes: {{ int64 .Values.config.maxValueBytes }}
    {{- include "berserk-common.observability-config" . | nindent 4 }}
{{- end }}
{{- include "berserk-common.configmap" . }}
