{{ include "berserk-common.configmap.metadata" . }}
data:
  config.yaml: |
    bind: "0.0.0.0:{{ .Values.service.port }}"
    public_base_url: {{ .Values.config.publicBaseUrl | default .Values.global.publicBaseUrl | required "publicBaseUrl is required — set global.publicBaseUrl (or admin-ui.config.publicBaseUrl)" | quote }}
    deployment_mode: {{ .Values.config.deploymentMode | quote }}
    permissions_base_url: {{ .Values.config.permissions.baseUrl | quote }}
    permissions_request_timeout_secs: {{ .Values.config.permissions.requestTimeoutSecs }}
    permissions_connect_timeout_secs: {{ .Values.config.permissions.connectTimeoutSecs }}
    {{- if .Values.config.oidc.enabled }}
    # OIDC config mirror — values come from the same overlay block
    # that drives gateway. admin_ui validates the same way (issuer
    # URL, ≥32-char client_secret floor, required-scope union,
    # SaaS+no-OIDC rejection) so config-drift fails admin_ui at
    # startup too.
    oidc_issuer: {{ required "admin-ui.config.oidc.issuer is required when config.oidc.enabled" .Values.config.oidc.issuer | quote }}
    oidc_client_id: {{ required "admin-ui.config.oidc.clientId is required when config.oidc.enabled" .Values.config.oidc.clientId | quote }}
    oidc_require_email_verified: {{ .Values.config.oidc.requireEmailVerified }}
    {{- with .Values.config.oidc.scopes }}
    oidc_scopes:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.config.oidc.bootstrapAdminEmails }}
    oidc_bootstrap_admin_emails:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- end }}
    {{- include "berserk-common.observability-config" . | nindent 4 }}
