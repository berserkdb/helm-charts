# CI-specific values overrides for testing in Kind
# Used by .github/workflows/ci.yml

global:
  storage:
    endpoint: "http://minio:9000"
    bucket: "berserk-test"
    region: "us-east-1"
  imagePullPolicy: IfNotPresent
  s3Credentials:
    managed: true
    accessKeyId: "minioadmin"
    secretAccessKey: "minioadmin"
  postgresCredentials:
    managed: true
    databaseUrl: "postgres://postgres:testpassword@postgres-postgresql:5432/berserk?sslmode=disable"
  # Auth-side services share the meta DB and isolate themselves
  # via the `auth` schema (gateway creates the schema on first
  # boot and sets `search_path = auth`; admin_ui and permissions
  # honour the same schema on every connection). `secretName` is
  # overridden because the chart default `"postgres-credentials"`
  # collides with `global.postgresCredentials.secretName` when both
  # are managed.
  authPostgresCredentials:
    managed: true
    secretName: "auth-postgres-credentials"
    databaseUrl: "postgres://postgres:testpassword@postgres-postgresql:5432/berserk?sslmode=disable"
  # authDatabaseSchema inherits the umbrella default of "auth"; the
  # auth-side binaries also default to "auth" when the env var is
  # unset, so this only needs to be overridden to "" for two-DB
  # layouts (see charts/values-dev.yaml).
  ingestToken:
    managed: true

meta:
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "250m"

query:
  cache:
    # Keep the CI smoke install in the in-process shape: emptyDir
    # cache, in-process workers, no child processes spawned. The
    # production-shape combination (`mode: remote` +
    # `config.transport: grpc_spawn`, with apps/query forking
    # cache_server and a qws pool) requires a writable cache_dir,
    # which `enabled: false` skipped. Per-cluster overlays
    # (`charts/values-dev.yaml`, `charts/values-valhalla.yaml`)
    # exercise the production shape.
    enabled: true
    mode: "local"
    size: "1Gi"
  config:
    transport: "in_process"
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

ingest:
  config:
    ingestToken:
      secretName: ""
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

janitor:
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

nursery:
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

ui:
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "250m"

# Auth stack — gateway + admin-ui + permissions. Enabled here so the
# helm-integration smoke install exercises the production shape (ui
# behind gateway, OIDC-disabled / password-only). The chart synths
# random values into `gateway-secrets` itself via `secrets.managed:
# true`; OIDC stays off so we don't need a real IdP, and the bootstrap
# admin block stays empty (the smoke install never actually authenticates
# — it just checks the pods come up Ready).
gateway:
  enabled: true
  config:
    publicBaseUrl: "http://localhost"
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "250m"

admin-ui:
  enabled: true
  config:
    publicBaseUrl: "http://localhost"
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "250m"

permissions:
  enabled: true
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "250m"
