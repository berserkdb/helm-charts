# CI-specific values overrides for testing in Kind
# Used by .github/workflows/ci.yml

global:
  storage:
    endpoint: "http://minio:9000"
    bucket: "berserk-test"
    region: "us-east-1"
  imagePullPolicy: IfNotPresent
  s3Credentials:
    managed: true
    accessKeyId: "minioadmin"
    secretAccessKey: "minioadmin"
  postgresCredentials:
    managed: true
    databaseUrl: "postgres://postgres:testpassword@postgres-postgresql:5432/berserk?sslmode=disable"
  ingestToken:
    managed: true

meta:
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "250m"

query:
  cache:
    # Keep the CI smoke install in the in-process shape: emptyDir
    # cache, in-process workers, no child processes spawned. The
    # production-shape combination (`mode: remote` +
    # `config.transport: grpc_spawn`, with apps/query forking
    # cache_server and a qws pool) requires a writable cache_dir,
    # which `enabled: false` skipped. Per-cluster overlays
    # (`charts/values-dev.yaml`, `charts/values-valhalla.yaml`)
    # exercise the production shape.
    enabled: true
    mode: "local"
    size: "1Gi"
  config:
    transport: "in_process"
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

ingest:
  config:
    ingestToken:
      secretName: ""
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

janitor:
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

nursery:
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

ui:
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "250m"
