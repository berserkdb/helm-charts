# Local-kind overrides for the umbrella chart.
#
# Pairs with `tools/scripts/kind-up.sh` to bring up the full stack
# (meta/query/ingest/janitor/nursery/ui + gateway/admin-ui/permissions)
# against a kind cluster, using locally-built `berserk/*-dev:dev`
# Bazel OCI images instead of the published `ghcr.io/berserkdb/*` ones.
#
# The image-ref overrides match the `oci_load.repo_tags` declared in
# each app's BUILD.bazel:
#   //apps/meta:meta_tarball         → berserk/meta-dev:dev
#   //apps/query:query_tarball       → berserk/query-dev:dev
#   //apps/ingest:ingest_tarball     → berserk/ingest-dev:dev
#   //apps/janitor:janitor_tarball   → berserk/janitor-dev:dev
#   //apps/nursery:nursery_tarball   → berserk/nursery-dev:dev
#   //apps/ui:ui_tarball             → berserk/ui-dev:dev
#   //apps/gateway:gateway_tarball   → berserk/gateway-dev:dev
#   //apps/admin_ui:admin_ui_tarball   → berserk/admin-ui-dev:dev
#   //apps/permissions:permissions_tarball → berserk/permissions-dev:dev
#   //apps/cli:cli_tarball           → berserk/cli-dev:dev

global:
  imageRegistry: "berserk"
  imageTag: "dev"
  # `Never` so the kubelet uses the kind-loaded images instead of
  # round-tripping through docker.io (which 404s — these images
  # exist only in the local docker daemon / kind node).
  imagePullPolicy: Never
  storage:
    endpoint: "http://minio:9000"
    bucket: "berserk-test"
    region: "us-east-1"
  s3Credentials:
    managed: true
    accessKeyId: "minioadmin"
    secretAccessKey: "minioadmin"
  postgresCredentials:
    managed: true
    databaseUrl: "postgres://postgres:testpassword@postgres-postgresql:5432/berserk?sslmode=disable"
  # Auth-side services share the meta DB and isolate themselves
  # via the `auth` schema (gateway creates the schema on first
  # boot and sets `search_path = auth`; admin_ui and permissions
  # honour the same schema on every connection).
  authPostgresCredentials:
    managed: true
    secretName: "auth-postgres-credentials"
    databaseUrl: "postgres://postgres:testpassword@postgres-postgresql:5432/berserk?sslmode=disable"
  # authDatabaseSchema inherits the umbrella default of "auth".
  ingestToken:
    managed: true
  observability:
    otlpEnabled: true

# Resource floors mirror charts/ci/values-ci.yaml so a single kind
# node can fit the whole stack.
meta:
  image: { pullPolicy: Never, repository: "meta-dev" }
  resources:
    requests: { memory: "64Mi", cpu: "50m" }
    limits: { memory: "256Mi", cpu: "250m" }

query:
  image: { pullPolicy: Never, repository: "query-dev" }
  cache:
    enabled: true
    mode: "local"
    size: "1Gi"
  config:
    transport: "in_process"
  resources:
    requests: { memory: "128Mi", cpu: "100m" }
    limits: { memory: "512Mi", cpu: "500m" }

ingest:
  image: { pullPolicy: Never, repository: "ingest-dev" }
  # init-ingest-token container shells out to the cli image; point at
  # the Bazel-tagged `berserk/cli-dev:dev` instead of `cli`.
  cliImage:
    repository: "cli-dev"
  resources:
    requests: { memory: "128Mi", cpu: "100m" }
    limits: { memory: "512Mi", cpu: "500m" }

janitor:
  image: { pullPolicy: Never, repository: "janitor-dev" }
  resources:
    requests: { memory: "128Mi", cpu: "100m" }
    limits: { memory: "512Mi", cpu: "500m" }

nursery:
  image: { pullPolicy: Never, repository: "nursery-dev" }
  resources:
    requests: { memory: "128Mi", cpu: "100m" }
    limits: { memory: "512Mi", cpu: "500m" }

ui:
  image: { pullPolicy: Never, repository: "ui-dev" }
  resources:
    requests: { memory: "64Mi", cpu: "50m" }
    limits: { memory: "256Mi", cpu: "250m" }

setup:
  image: { pullPolicy: Never, repository: "cli-dev" }

# New auth-edge stack — opted into for the kind smoke.
gateway:
  enabled: true
  image: { pullPolicy: Never, repository: "gateway-dev" }
  config:
    # Browser reaches the gateway via `kubectl port-forward` →
    # localhost. The in-cluster `gateway:9500` hostname isn't
    # resolvable from a host browser, so all minted redirect URIs
    # (OIDC `redirect_uri`, the bootstrap `/setup?token=…` link)
    # must use the loopback host the operator actually hits.
    publicBaseUrl: "http://127.0.0.1:9500"
    # Plain HTTP in local kind — disable Secure-cookie flag so
    # browser-side flows work over the bring-up's port-forward.
    cookieSecure: false
    # `upstreamBaseUrl` + `adminUpstreamBaseUrl` are inherited from
    # the gateway subchart defaults (`http://ui` + `http://admin-ui:9570`).
    # The umbrella chart's Service layout makes these always work.
  resources:
    requests: { memory: "64Mi", cpu: "50m" }
    limits: { memory: "256Mi", cpu: "250m" }

admin-ui:
  enabled: true
  image: { pullPolicy: Never, repository: "admin-ui-dev" }
  config:
    publicBaseUrl: "http://127.0.0.1:9500"
  resources:
    requests: { memory: "64Mi", cpu: "50m" }
    limits: { memory: "256Mi", cpu: "250m" }

permissions:
  enabled: true
  image: { pullPolicy: Never, repository: "permissions-dev" }
  resources:
    requests: { memory: "32Mi", cpu: "25m" }
    limits: { memory: "128Mi", cpu: "250m" }
